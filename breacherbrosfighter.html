<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Browser FPS Game</title>
  <style>
    html, body { margin: 0; padding: 0; overflow: hidden; font-family: Arial, sans-serif; background: #000; }
    #menu, #briefing {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%,-50%);
      background: rgba(20,20,20,0.8); color: #fff;
      padding: 20px; border-radius: 10px; text-align: center;
      border: 2px solid rgba(255,255,255,0.2);
      backdrop-filter: blur(5px);
    }
    #menu h2, #briefing h2 { margin-bottom: 10px; }
    #menu button, #briefing button {
      display: block; width: 200px; margin: 10px auto;
      padding: 10px; font-size: 16px;
      background: rgba(255,165,0,0.3); border: 1px solid orange;
      color: #fff; border-radius: 5px; cursor: pointer;
    }
    #menu button:hover, #briefing button:hover {
      background: rgba(255,165,0,0.5);
    }
    #briefing { display: none; }
    #hud {
      position: fixed; top: 10px; left: 10px;
      color: #fff; font-size: 18px; line-height: 1.5em;
      text-shadow: 0 0 5px #000;
    }
    #hud div { margin-bottom: 5px; }
    #crosshair {
      position: fixed; top: 50%; left: 50%;
      width: 20px; height: 20px;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }
    #crosshair:before, #crosshair:after {
      content: '';
      position: absolute; background: rgba(255,0,0,0.8);
    }
    #crosshair:before {
      left: 50%; top: 0; width: 2px; height: 100%;
      transform: translateX(-50%);
    }
    #crosshair:after {
      top: 50%; left: 0; width: 100%; height: 2px;
      transform: translateY(-50%);
    }
    canvas { display: block; }
  </style>
</head>
<body>
  <div id="menu">
    <h2>Klassenwahl</h2>
    <button data-class="Assault">Assault (Balanced)</button>
    <button data-class="Breacher">Breacher (Heavy)</button>
    <button data-class="Scout">Scout (Speed)</button>
    <button data-class="Engineer">Engineer (Utility)</button>
    <button data-class="Sniper">Sniper (Range)</button>
  </div>
  <div id="briefing">
    <h2 id="class-name"></h2>
    <p id="class-desc"></p>
    <button id="startGame">Los geht's!</button>
  </div>
  <div id="hud">
    <div id="health">Leben: 100</div>
    <div id="ammo">Munition: 0/0</div>
    <div id="info">Klasse: - Level: - Gegner: -</div>
  </div>
  <div id="crosshair"></div>
  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.148.0/build/three.module.js';
    import { PointerLockControls } from 'https://cdn.jsdelivr.net/npm/three@0.148.0/examples/jsm/controls/PointerLockControls.js';

    // Klassen-Definitionen
    const classes = {
      'Assault':   { health: 100, speed: 400, ammo: 30, reloadTime: 2000, desc: "Ausgewogen, solide Feuerkraft." },
      'Breacher':  { health: 150, speed: 350, ammo: 20, reloadTime: 3000, desc: "Schwere Bewaffnung und Schutz, langsam." },
      'Scout':     { health:  80, speed: 500, ammo: 25, reloadTime: 1500, desc: "Sehr schnell, aber schwächer." },
      'Engineer':  { health: 100, speed: 400, ammo: 30, reloadTime: 2000, desc: "Vielseitig mit Geräten, ausgeglichen." },
      'Sniper':    { health:  80, speed: 350, ammo: 10, reloadTime: 3000, desc: "Langstreckenspezialist, geringe Panzerung." }
    };

    let selectedClass = null;
    let player = { health: 100, maxHealth: 100, speed: 400, ammo: 0, maxAmmo: 0, reloadTime: 0, reloading: false };
    let level = 0;
    let enemies = [];

    // UI-Elemente
    const menu = document.getElementById('menu');
    const briefing = document.getElementById('briefing');
    const classNameEl = document.getElementById('class-name');
    const classDescEl = document.getElementById('class-desc');
    const startButton = document.getElementById('startGame');
    const healthEl = document.getElementById('health');
    const ammoEl = document.getElementById('ammo');
    const infoEl = document.getElementById('info');

    // Klassenwahl
    document.querySelectorAll('#menu button').forEach(btn => {
      btn.addEventListener('click', () => {
        selectedClass = btn.getAttribute('data-class');
        const cls = classes[selectedClass];
        classNameEl.innerText = selectedClass;
        classDescEl.innerText = cls.desc;
        briefing.style.display = 'block';
        menu.style.display = 'none';
      });
    });

    // Spiel starten
    startButton.addEventListener('click', () => {
      const cls = classes[selectedClass];
      player.health = cls.health;
      player.maxHealth = cls.health;
      player.speed = cls.speed;
      player.ammo = cls.ammo;
      player.maxAmmo = cls.ammo;
      player.reloadTime = cls.reloadTime;
      updateHUD();
      briefing.style.display = 'none';
      initGame();
      // Sperre den Cursor
      document.body.click(); // Simuliere Klick zum Lock (PointerLock)
    });

    let camera, scene, renderer, controls;
    let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false, sprint = false;
    let prevTime = performance.now();

    function initGame() {
      // Szene und Kamera
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x202020);
      camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 1, 1000);
      camera.position.set(0, 5, 10);

      // Licht
      const light = new THREE.DirectionalLight(0xffffff, 0.8);
      light.position.set(0, 50, 50);
      scene.add(light);

      // Boden
      const floorGeo = new THREE.PlaneGeometry(200, 200);
      const floorMat = new THREE.MeshPhongMaterial({ color: 0x111111 });
      const floor = new THREE.Mesh(floorGeo, floorMat);
      floor.rotation.x = -Math.PI/2;
      scene.add(floor);

      // Renderer
      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      document.body.appendChild(renderer.domElement);

      // PointerLockControls
      controls = new PointerLockControls(camera, document.body);
      document.body.addEventListener('click', () => {
        controls.lock();
      });
      scene.add(controls.getObject());

      // Bewegungstasten
      const onKeyDown = (event) => {
        switch (event.code) {
          case 'KeyW': moveForward = true; break;
          case 'KeyA': moveLeft = true; break;
          case 'KeyS': moveBackward = true; break;
          case 'KeyD': moveRight = true; break;
          case 'ShiftLeft': sprint = true; break;
          case 'KeyR':
            if (!player.reloading && player.ammo < player.maxAmmo) reloadWeapon();
            break;
        }
      };
      const onKeyUp = (event) => {
        switch (event.code) {
          case 'KeyW': moveForward = false; break;
          case 'KeyA': moveLeft = false; break;
          case 'KeyS': moveBackward = false; break;
          case 'KeyD': moveRight = false; break;
          case 'ShiftLeft': sprint = false; break;
        }
      };
      document.addEventListener('keydown', onKeyDown);
      document.addEventListener('keyup', onKeyUp);

      // Schuss (Mausklick)
      document.addEventListener('mousedown', (event) => {
        if (controls.isLocked && event.button === 0) {
          shoot();
        }
      });

      // Fenstergröße
      window.addEventListener('resize', onWindowResize);

      // Level starten
      nextLevel();
      animate();
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth/window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function nextLevel() {
      level++;
      if (level > 20) {
        alert('Alle Level abgeschlossen!');
        return;
      }
      // Entferne alte Gegner
      enemies.forEach(e => scene.remove(e.mesh));
      enemies = [];
      // Neue Gegner
      const count = level * 3;
      for (let i = 0; i < count; i++) {
        const box = new THREE.BoxGeometry(1, 2, 1);
        const mat = new THREE.MeshPhongMaterial({ color: 0xff0000 });
        const mesh = new THREE.Mesh(box, mat);
        mesh.position.set((Math.random()-0.5)*100, 1, (Math.random()-0.5)*100);
        scene.add(mesh);
        enemies.push({ mesh: mesh, health: 50, attackCooldown: 0 });
      }
      updateHUD();
    }

    function updateHUD() {
      healthEl.innerText = `Leben: ${player.health}`;
      ammoEl.innerText = player.reloading ? 'Nachladen...' : `Munition: ${player.ammo}/${player.maxAmmo}`;
      infoEl.innerText = `Klasse: ${selectedClass} Level: ${level} Gegner: ${enemies.length}`;
    }

    function reloadWeapon() {
      player.reloading = true;
      updateHUD();
      setTimeout(() => {
        player.ammo = player.maxAmmo;
        player.reloading = false;
        updateHUD();
      }, player.reloadTime);
    }

    function shoot() {
      if (player.ammo <= 0 || player.reloading) return;
      player.ammo--;
      updateHUD();
      // Strahl (Raycast)
      const origin = controls.getObject().position.clone();
      const direction = new THREE.Vector3(0, 0, -1).applyQuaternion(controls.getObject().quaternion);
      const raycaster = new THREE.Raycaster(origin, direction);
      const hitList = raycaster.intersectObjects(enemies.map(e => e.mesh));
      if (hitList.length > 0) {
        const hitMesh = hitList[0].object;
        const enemy = enemies.find(e => e.mesh === hitMesh);
        if (enemy) {
          enemy.health -= 50;
          // Treffer-Feedback: kurz gelb
          hitMesh.material.color.set(0xffff00);
          setTimeout(() => { if (hitMesh.material) hitMesh.material.color.set(0xff0000); }, 100);
          if (enemy.health <= 0) {
            scene.remove(enemy.mesh);
            enemies = enemies.filter(e => e !== enemy);
            updateHUD();
          }
        }
      }
    }

    function updateEnemies(delta) {
      enemies.forEach(enemy => {
        // Abklingzeit verringern
        if (enemy.attackCooldown > 0) {
          enemy.attackCooldown -= delta;
        }
        // Bewegung zum Spieler
        const playerPos = controls.getObject().position;
        const dir = new THREE.Vector3().subVectors(playerPos, enemy.mesh.position);
        const dist = dir.length();
        if (dist > 1) {
          dir.normalize();
          enemy.mesh.position.add(dir.multiplyScalar(1.5 * delta));
        }
        // Angriff, wenn nah genug
        if (dist < 2 && enemy.attackCooldown <= 0) {
          player.health -= 10;
          enemy.attackCooldown = 2; // 2 Sekunden Pause bis nächster Treffer
          enemy.mesh.material.color.set(0x880000);
          setTimeout(() => { if (enemy.mesh.material) enemy.mesh.material.color.set(0xff0000); }, 100);
          if (player.health <= 0) {
            alert('Game Over!');
            window.location.reload();
          }
          updateHUD();
        }
      });
      // Nächstes Level
      if (enemies.length === 0) {
        setTimeout(nextLevel, 1000);
      }
    }

    function animate() {
      requestAnimationFrame(animate);
      if (controls && controls.isLocked) {
        const time = performance.now();
        const delta = (time - prevTime) / 1000;
        prevTime = time;
        // Bewegung
        const actualSpeed = player.speed * (sprint ? 1.5 : 1);
        if (moveForward) controls.moveForward(-actualSpeed * delta);
        if (moveBackward) controls.moveForward(actualSpeed * delta);
        if (moveLeft) controls.moveRight(-actualSpeed * delta);
        if (moveRight) controls.moveRight(actualSpeed * delta);
        // Gegnerverhalten
        updateEnemies(delta);
      }
      renderer.render(scene, camera);
    }
  </script>
</body>
</html>
