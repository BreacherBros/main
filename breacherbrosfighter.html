<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>BreacherBros — Solo FPS</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    :root {
      --accent: #ff3b3b;
      --accent2: #ffd166;
      --bg: #0b0f13;
      --panel: rgba(10, 12, 14, 0.75);
      --glass: rgba(255, 255, 255, 0.04);
      --text: #e6eef8;
      font-family: Inter, system-ui, -apple-system, Roboto, "Segoe UI", "Helvetica Neue", Arial;
    }
    html, body { height: 100%; margin: 0; background: linear-gradient(180deg, #071018 0%, #0b1220 100%); overflow: hidden; color: var(--text); }
    canvas { display: block; position: absolute; top: 0; left: 0; z-index: 0; }

    /* UI */
    #ui { position: absolute; left: 0; right: 0; top: 0; bottom: 0; pointer-events: auto; z-index: 10; }
    .panel { position: absolute; background: var(--panel); backdrop-filter: blur(6px); border-radius: 14px; padding: 14px; box-shadow: 0 8px 30px rgba(0,0,0,0.6); color: var(--text); pointer-events: auto; }
    #startScreen { width: 640px; left: 50%; top: 50%; transform: translate(-50%, -50%); text-align: center; padding: 28px; border-radius: 16px;
                   background: radial-gradient(circle at 30% 10%, rgba(255,59,59,0.12), rgba(0,0,0,0.7)); border: 2px solid rgba(255,59,59,0.18);
                   box-shadow: 0 12px 60px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.02); }
    .logoTitle { font-size: 42px; letter-spacing: 2px; margin: 6px 0; font-weight: 800; color: var(--accent); }
    .logoSub { opacity: 0.9; margin-bottom: 10px; color: var(--text); }

    /* Klassen-Auswahl */
    #classSelect { display: flex; flex-wrap: wrap; gap: 12px; justify-content: flex-start; align-items: flex-start; }
    .classBtn { flex: 0 0 auto; min-width: 120px; display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.06); cursor: pointer; background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01)); transition: transform .12s ease, box-shadow .12s; }
    .classIcon { width: 56px; height: 56px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-weight: 700; color: #08101a; flex-shrink: 0; }
    .selectedClass { box-shadow: 0 0 26px rgba(255,59,59,0.25); transform: translateY(-4px); }

    .startLarge { margin-top: 14px; padding: 14px 20px; font-size: 18px; border-radius: 12px; background: linear-gradient(90deg, var(--accent), #ff7b7b); color: #08101a; border: none; cursor: pointer; font-weight: 700; }
    .startLarge[disabled] { opacity: 0.45; cursor: not-allowed; }

    /* HUD */
    #hudTop { left: 12px; top: 12px; }
    #hudBottom { left: 12px; bottom: 12px; }
    .hudItem { margin-bottom: 8px; padding: 8px 12px; border-radius: 8px; background: var(--glass); display: inline-block; }
    /* Center crosshair */
    #crosshair { position: absolute; left: 50%; top: 50%; width: 24px; height: 24px; margin-left: -12px; margin-top: -12px; pointer-events: none; }
    #crosshair:before, #crosshair:after { content: ''; position: absolute; background: var(--accent); opacity: 0.95; }
    #crosshair:before { left: 11px; top: 0; width: 2px; height: 24px; }
    #crosshair:after { top: 11px; left: 0; height: 2px; width: 24px; }
    /* Small message */
    #message { position: absolute; right: 12px; top: 12px; padding: 10px 14px; border-radius: 10px; background: rgba(0,0,0,0.45); }
    /* Level panel */
    #levelPanel { position: absolute; right: 12px; bottom: 12px; padding: 14px 18px; border-radius: 12px; }
    /* Responsive */
    @media (max-width:800px) {
      #startScreen { width: 94%; }
      .logoTitle { font-size: 30px; }
      #classSelect { flex-direction: column; }
    }
  </style>
</head>
<body>
  <div id="ui">
    <div id="startScreen" class="panel">
      <div style="display:flex;align-items:center;gap:12px;justify-content:center;margin-bottom:20px;">
        <div style="text-align:left">
          <div class="logoTitle">BREACHERBROS</div>
          <div class="logoSub">Wähle eine Klasse & starte die Mission</div>
        </div>
      </div>
      <div id="classSelect" aria-label="Klassen Auswahl"></div>
      <button id="startGame" class="startLarge" disabled>Start Mission</button>
      <div style="margin-top:12px;font-size:13px;opacity:0.9">Controls: WASD bewegen · Maus zielen · Klick schießen · R nachladen · Shift sprint · ESC pausieren</div>
    </div>

    <div id="hudTop" class="panel">
      <div id="hpHud" class="hudItem">HP: <span id="hpVal">100</span></div>
      <div id="ammoHud" class="hudItem">Ammo: <span id="ammoVal">30</span>/<span id="magSize">30</span></div>
    </div>

    <div id="hudBottom" class="panel">
      <div id="classHud" class="hudItem">Klasse: <b id="className">-</b></div>
      <div id="levelHud" class="hudItem">Level: <b id="levelNum">0</b></div>
    </div>

    <div id="message" class="panel" aria-live="polite">Bereit</div>
    <div id="levelPanel" class="panel">Gegner: <span id="enemyCount">0</span></div>
    <div id="crosshair" aria-hidden="true"></div>
  </div>

  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
    import { PointerLockControls } from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/PointerLockControls.js';

    // Spielvariablen
    let scene, camera, renderer, controls;
    const clock = new THREE.Clock();
    const raycaster = new THREE.Raycaster();
    const enemies = [];

    const player = {
      health: 100, maxHealth: 100, speed: 6, sprintMultiplier: 1.7,
      ammo: 0, magSize: 0, reloadTime: 1.6, fireRate: 0.12, lastShot: 0,
      selectedClass: null, level: 0, reloading: false
    };

    // Definition der Klassen
    const classes = [
      { id: 'assault', name: 'Assault', desc: 'Balanced - guter Allrounder', hp: 110, speed: 6, fireRate: 0.12, mag: 30, reload: 1.6, color: 0xff6b6b },
      { id: 'breacher', name: 'Breacher', desc: 'High HP, langsamer', hp: 150, speed: 4.8, fireRate: 0.16, mag: 20, reload: 2.0, color: 0xffb86b },
      { id: 'scout', name: 'Scout', desc: 'Schnell, weniger HP', hp: 80, speed: 8.2, fireRate: 0.10, mag: 24, reload: 1.4, color: 0x6bdeff },
      { id: 'engineer', name: 'Engineer', desc: 'Gute Rüstung, Spezial-Tools', hp: 120, speed: 5.6, fireRate: 0.14, mag: 28, reload: 1.5, color: 0x9d6bff },
      { id: 'medic',   name: 'Medic',   desc: 'Heilt und unterstützt, durchschnittlich', hp: 100, speed: 5.8, fireRate: 0.13, mag: 26, reload: 1.8, color: 0x6bff90 }
    ];

    // UI-Elemente
    const startBtn = document.getElementById('startGame');
    const classSelect = document.getElementById('classSelect');
    const classNameUI = document.getElementById('className');
    const hpVal = document.getElementById('hpVal');
    const ammoVal = document.getElementById('ammoVal');
    const magSizeUI = document.getElementById('magSize');
    const levelNum = document.getElementById('levelNum');
    const enemyCount = document.getElementById('enemyCount');
    const messageDiv = document.getElementById('message');

    // Klassen-Auswahl-Buttons erstellen
    classes.forEach(c => {
      const btn = document.createElement('button');
      btn.className = 'classBtn';
      const colorHex = '#' + c.color.toString(16).padStart(6, '0');
      btn.innerHTML = `
        <div class="classIcon" style="background:${colorHex}">${c.id.charAt(0).toUpperCase()}</div>
        <div>
          <div><b>${c.name}</b></div>
          <div style="font-size:12px;opacity:0.8">${c.desc}</div>
        </div>
      `;
      btn.addEventListener('click', () => selectClass(c, btn));
      classSelect.appendChild(btn);
    });

    function selectClass(c, btn) {
      player.selectedClass = c;
      player.health = c.hp;
      player.maxHealth = c.hp;
      player.ammo = c.mag;
      player.magSize = c.mag;
      player.reloadTime = c.reload;
      player.fireRate = c.fireRate;
      player.speed = c.speed;
      classNameUI.textContent = c.name;
      hpVal.textContent = player.health;
      ammoVal.textContent = player.ammo;
      magSizeUI.textContent = player.magSize;
      startBtn.disabled = false;
      document.querySelectorAll('.classBtn').forEach(b => b.classList.remove('selectedClass'));
      btn.classList.add('selectedClass');
    }

    startBtn.addEventListener('click', () => {
      document.getElementById('startScreen').style.display = 'none';
      player.level = 1;
      levelNum.textContent = player.level;
      messageDiv.textContent = `Level ${player.level}`;
      initGame();
      animate();
      setTimeout(() => { messageDiv.textContent = ''; }, 2000);
    });

    // Initialisierung von Three.js und Spiel
    function initGame() {
      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 1.7, 0);

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      document.body.appendChild(renderer.domElement);

      // PointerLockControls für Kamera
      controls = new PointerLockControls(camera, document.body);
      document.body.addEventListener('click', () => {
        if (controls) controls.lock();
      });
      scene.add(controls.getObject());

      // Licht
      const light = new THREE.DirectionalLight(0xffffff, 1);
      light.position.set(5, 10, 7);
      scene.add(light);
      const ambient = new THREE.AmbientLight(0xffffff, 0.3);
      scene.add(ambient);

      // Boden
      const floorMat = new THREE.MeshStandardMaterial({ color: 0x101010 });
      const floor = new THREE.Mesh(new THREE.PlaneGeometry(200, 200), floorMat);
      floor.rotation.x = -Math.PI / 2;
      scene.add(floor);

      // Einfache Hindernisse (Boxen) als Cover
      const boxGeo = new THREE.BoxGeometry(1, 1, 1);
      const boxMat = new THREE.MeshStandardMaterial({ color: 0x404040, metalness: 0.1, roughness: 0.8 });
      for (let i = 0; i < 10; i++) {
        const box = new THREE.Mesh(boxGeo, boxMat);
        box.position.set((Math.random() - 0.5) * 50, 0.5, (Math.random() - 0.5) * 50);
        scene.add(box);
      }

      // Gegner für Level 1 spawnen
      spawnEnemies(player.level * 3 + 2);
      updateEnemyCount();

      // Event-Listener für Eingaben
      document.addEventListener('keydown', onKeyDown);
      document.addEventListener('keyup', onKeyUp);
      document.addEventListener('mousedown', onMouseDown);
      document.addEventListener('keydown', onReload);
      window.addEventListener('resize', onWindowResize);
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    // Bewegung
    const move = { forward: false, backward: false, left: false, right: false, sprint: false };
    function onKeyDown(event) {
      switch (event.code) {
        case 'KeyW': move.forward = true; break;
        case 'KeyS': move.backward = true; break;
        case 'KeyA': move.left = true; break;
        case 'KeyD': move.right = true; break;
        case 'ShiftLeft': move.sprint = true; break;
        case 'Escape': if (controls) controls.unlock(); break;
      }
    }
    function onKeyUp(event) {
      switch (event.code) {
        case 'KeyW': move.forward = false; break;
        case 'KeyS': move.backward = false; break;
        case 'KeyA': move.left = false; break;
        case 'KeyD': move.right = false; break;
        case 'ShiftLeft': move.sprint = false; break;
      }
    }

    // Schießen
    function onMouseDown(event) {
      if (event.button !== 0) return; // nur Linksklick
      shoot();
    }

    function shoot() {
      if (!controls.isLocked) return;
      if (player.reloading) return;
      const time = clock.getElapsedTime();
      if (time - player.lastShot < player.fireRate) return;
      if (player.ammo <= 0) return;
      player.lastShot = time;
      player.ammo--;
      ammoVal.textContent = player.ammo;
      // Trefferabfrage via Raycast
      raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
      const hits = raycaster.intersectObjects(enemies, false);
      if (hits.length > 0) {
        const enemy = hits[0].object;
        scene.remove(enemy);
        const index = enemies.indexOf(enemy);
        if (index > -1) enemies.splice(index, 1);
        updateEnemyCount();
      }
      // Wenn letzter Gegner, Level aufsteigen
      if (enemies.length === 0) {
        nextLevel();
      }
    }

    // Nachladen
    function onReload(event) {
      if (event.code === 'KeyR') {
        if (player.reloading) return;
        if (player.ammo < player.magSize) {
          player.reloading = true;
          messageDiv.textContent = 'Nachladen...';
          setTimeout(() => {
            player.ammo = player.magSize;
            ammoVal.textContent = player.ammo;
            player.reloading = false;
            messageDiv.textContent = '';
          }, player.reloadTime * 1000);
        }
      }
    }

    function updateEnemyCount() {
      enemyCount.textContent = enemies.length;
    }

    // Gegner spawnen
    function spawnEnemies(num) {
      for (let i = 0; i < num; i++) {
        const size = 1;
        const geometry = new THREE.BoxGeometry(size, size * 2, size);
        const material = new THREE.MeshStandardMaterial({ color: 0x8f8f8f });
        const enemy = new THREE.Mesh(geometry, material);
        const angle = Math.random() * Math.PI * 2;
        const distance = 20 + Math.random() * 30;
        enemy.position.set(Math.cos(angle) * distance, 1, Math.sin(angle) * distance);
        enemy.speed = 2 + Math.random() * 1 + player.level * 0.2;
        scene.add(enemy);
        enemies.push(enemy);
      }
    }

    function nextLevel() {
      player.level++;
      levelNum.textContent = player.level;
      messageDiv.textContent = `Level ${player.level}`;
      setTimeout(() => { messageDiv.textContent = ''; }, 2000);
      spawnEnemies(player.level * 3 + 2);
      updateEnemyCount();
    }

    let gameOver = false;
    // Haupt-Animationsschleife
    function animate() {
      if (gameOver) return;
      requestAnimationFrame(animate);
      const delta = clock.getDelta();

      // Spielertempo berechnen
      if (controls.isLocked) {
        let speed = player.speed * (move.sprint ? player.sprintMultiplier : 1);
        if (move.forward) controls.moveForward(speed * delta);
        if (move.backward) controls.moveForward(-speed * delta);
        if (move.left) controls.moveRight(-speed * delta);
        if (move.right) controls.moveRight(speed * delta);
      }
      // Spielerposition aktualisieren (für Gegner-KI)
      player.position = camera.position.clone();

      // Gegner-KI: bewegen sich auf Spieler zu
      enemies.forEach(enemy => {
        const direction = new THREE.Vector3();
        direction.subVectors(player.position, enemy.position).normalize();
        enemy.position.add(direction.multiplyScalar(enemy.speed * delta));
        // Schaden bei Kontakt
        const distance = enemy.position.distanceTo(player.position);
        if (distance < 2) {
          player.health -= 10 * delta;
          player.health = Math.max(player.health, 0);
          hpVal.textContent = Math.floor(player.health);
          if (player.health <= 0) {
            gameOver = true;
            messageDiv.textContent = 'Game Over';
          }
        }
      });

      renderer.render(scene, camera);
    }
  </script>
</body>
</html>
