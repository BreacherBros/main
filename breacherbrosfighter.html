<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BREACHER BROS FIGHTER— FPS</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <!-- =========  SPIELMENÜ  ========= -->
  <div id="menu">
    <h2>Klassenwahl</h2>
    <button class="class-btn" data-class="Stürmer">Stürmer</button>
    <button class="class-btn" data-class="Verteidiger">Verteidiger</button>
    <button class="class-btn" data-class="Sanitäter">Sanitäter</button>
    <button class="class-btn" data-class="Techniker">Techniker</button>
    <button class="class-btn" data-class="Späher">Späher</button>
  </div>

  <!-- =========  BRIEFING  ========= -->
  <div id="briefing" style="display:none;"></div>

  <!-- =========  HUD  ========= -->
  <div id="hud" style="display:none;">
    <div id="health">Leben : 100</div>
    <div id="ammo">Munition : 0/0</div>
    <div id="ability">Fähigkeit : –</div>
    <div id="level">Level : 1</div>
  </div>

  <!-- =========  CANVAS  ========= -->
  <canvas id="gameCanvas"></canvas>

  <!-- =========  SCRIPT ========= -->
  <script type="module" src="./src/main.js"></script>
</body>
</html>
