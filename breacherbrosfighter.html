<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <title>Browser FPS Game — Debug & Fix Version</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    /* ----------------------
       Grundlayout / Menü / HUD
       ---------------------- */
    html, body { height: 100%; margin: 0; padding: 0; background: #000; font-family: Arial, sans-serif; overflow: hidden; }
    #menu {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%,-50%);
      width: 380px;
      background: rgba(16,16,18,0.98);
      color: #ffffff;
      border-radius: 10px;
      padding: 18px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.7);
      z-index: 9999; /* ganz oben */
      border: 1px solid rgba(255,255,255,0.04);
    }
    #menu h1 { margin: 0 0 12px 0; font-size: 20px; }
    .class-btn {
      display: block;
      width: 300px;
      margin: 8px auto;
      padding: 10px 12px;
      background: linear-gradient(180deg, rgba(255,165,0,0.18), rgba(255,165,0,0.10));
      border: 1px solid rgba(255,165,0,0.6);
      color: #fff;
      border-radius: 6px;
      font-size: 15px;
      cursor: pointer;
      text-align: left;
    }
    .class-btn:hover { background: rgba(255,165,0,0.26); }
    #briefing {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%,-50%);
      width: 440px;
      max-width: 92%;
      background: rgba(18,18,20,0.98);
      color: #fff;
      border-radius: 10px;
      padding: 18px;
      z-index: 9999;
      display: none;
      border: 1px solid rgba(255,255,255,0.04);
    }
    #briefing h2 { margin: 0 0 8px 0; font-size: 18px; }
    #briefing p { margin: 6px 0; color: #dcdcdc; }
    #startGameBtn {
      display: inline-block; margin-top: 12px; padding: 10px 14px; font-size: 15px;
      background: rgba(80,200,120,0.16); border: 1px solid rgba(80,200,120,0.6);
      color: #eaffea; border-radius: 6px; cursor: pointer;
    }
    #hud {
      position: fixed; left: 10px; top: 10px; z-index: 9998;
      background: rgba(0,0,0,0.45); color: #fff; padding: 10px 12px; border-radius: 8px; font-size: 14px;
      min-width: 220px; border: 1px solid rgba(255,255,255,0.06);
    }
    #crosshair {
      position: fixed; left: 50%; top: 50%; transform: translate(-50%,-50%); z-index: 9997; pointer-events: none;
      width: 18px; height: 18px;
    }
    #crosshair:before, #crosshair:after {
      content: ''; position: absolute; background: rgba(255,0,0,0.9);
    }
    #crosshair:before { left: 50%; top: 0; width: 2px; height: 100%; transform: translateX(-50%); }
    #crosshair:after { left: 0; top: 50%; width: 100%; height: 2px; transform: translateY(-50%); }

    /* Debug-Box (sichtbar, wenn Probleme) */
    #debugBox {
      position: fixed; right: 10px; bottom: 10px; z-index: 10000;
      width: 340px; max-height: 60vh; overflow:auto;
      background: rgba(10,10,10,0.9); color: #e6e6e6; font-size: 13px;
      padding: 10px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.04);
    }
    #debugBox h3 { margin: 0 0 6px 0; font-size: 14px; color: #ffd580; }
    #debugLog { white-space: pre-wrap; font-family: monospace; color: #cfcfcf; }

    /* Canvas container fallback - renderer wird dynamisch angehängt */
    #gameContainer { position: absolute; inset: 0; z-index: 1; background: #000; }

    /* kleine Hilfetexte */
    #hintBar { position: fixed; left: 12px; bottom: 12px; z-index: 9998; color: #ccc; font-size: 13px; }
  </style>
</head>
<body>
  <!-- MENU: Buttons müssen die class "class-btn" haben -->
  <div id="menu" role="dialog" aria-label="Klassenwahl">
    <h1>Klassenwahl</h1>
    <button class="class-btn" data-class="Assault" aria-pressed="false" tabindex="0">Assault — Ausgewogen</button>
    <button class="class-btn" data-class="Breacher" aria-pressed="false" tabindex="0">Breacher — Schwer</button>
    <button class="class-btn" data-class="Scout" aria-pressed="false" tabindex="0">Scout — Schnell</button>
    <button class="class-btn" data-class="Engineer" aria-pressed="false" tabindex="0">Engineer — Support</button>
    <button class="class-btn" data-class="Sniper" aria-pressed="false" tabindex="0">Sniper — Distanz</button>
    <p style="font-size:12px; color:#bbb; margin-top:8px;">Wähle eine Klasse. Wenn nichts passiert, prüfe die Konsole (F12) oder die Debug-Box unten rechts.</p>
  </div>

  <!-- Briefing / Start -->
  <div id="briefing" role="dialog" aria-label="Briefing">
    <!-- Dynamisch befüllt -->
  </div>

  <!-- Drei UI Elemente -->
  <div id="hud" aria-live="polite">
    <div id="health">Leben: -</div>
    <div id="ammo">Munition: -</div>
    <div id="info">Klasse: - | Level: - | Gegner: -</div>
    <div id="ability">Fähigkeit: -</div>
  </div>
  <div id="crosshair" aria-hidden="true"></div>
  <div id="hintBar">WASD • Shift • Linksklick • R • F</div>

  <!-- Game container (Three.js canvas wird hier reingehängt) -->
  <div id="gameContainer" aria-hidden="true"></div>

  <!-- Debug box -->
  <div id="debugBox" role="status" aria-live="polite">
    <h3>Debug / Status</h3>
    <div id="debugLog">Initialisiere…</div>
  </div>

  <!--
    Wichtig: Dieses Script nutzt ES6-Module (type="module"). 
    Teste idealerweise über einen lokalen Server (z.B. "npx http-server" oder VSCode Live Server).
  -->
  <script type="module">
    // =========================
    // Robust, defensiv & ausführlich — Menü-Fix Version
    // =========================

    // --- Debug-Log helper -------------------------------------------------
    const debugLogEl = document.getElementById('debugLog');
    function debugLog(msg, level='info') {
      const time = new Date().toLocaleTimeString();
      const entry = `[${time}] ${msg}`;
      // oben anhängen
      debugLogEl.textContent = entry + "\n" + debugLogEl.textContent;
      console.log(entry);
    }

    // Warte bis DOM fertig ist (verhindert race conditions)
    document.addEventListener('DOMContentLoaded', () => {
      debugLog('DOM geladen. Starte Initialisierung der Menüs...');

      // --- Klassen-Definitionen ------------------------------------------
      const classes = {
        'Assault': {
          health: 100, speed: 400, ammo: 30, reloadTime: 2000,
          ability: { name: 'Medikit', cooldown: 10000 }, desc: 'Ausgewogen. Heilt 50 HP.',
          color: 0x4aa3ff
        },
        'Breacher': {
          health: 150, speed: 350, ammo: 20, reloadTime: 3000,
          ability: { name: 'Sprengladung', cooldown: 15000 }, desc: 'Schwer gepanzert. Explosive Charge.',
          color: 0xff8a4a
        },
        'Scout': {
          health: 80, speed: 500, ammo: 25, reloadTime: 1500,
          ability: { name: 'Sprintboost', cooldown: 10000 }, desc: 'Sehr schnell. Kurzzeit Sprintboost.',
          color: 0x8eff7a
        },
        'Engineer': {
          health: 100, speed: 400, ammo: 30, reloadTime: 2000,
          ability: { name: 'Mini-Turret', cooldown: 15000 }, desc: 'Vielseitig. Setzt Minigeschütz.',
          color: 0xffd24a
        },
        'Sniper': {
          health: 80, speed: 350, ammo: 10, reloadTime: 3000,
          ability: { name: 'Fokus-Schuss', cooldown: 12000 }, desc: 'Langstreckenspezialist. Soforttreffer.',
          color: 0xcc88ff
        }
      };

      // --- Referenzen auf DOM-Elemente -----------------------------------
      const menuEl = document.getElementById('menu');
      const briefingEl = document.getElementById('briefing');
      const gameContainer = document.getElementById('gameContainer');
      const healthEl = document.getElementById('health');
      const ammoEl = document.getElementById('ammo');
      const infoEl = document.getElementById('info');
      const abilityEl = document.getElementById('ability');

      // selectedClass wird gesetzt, wenn Button geklickt
      let selectedClass = null;

      // Suche Buttons. Wenn keine gefunden, verwende Event-Delegation
      let classButtons = Array.from(document.querySelectorAll('.class-btn'));
      if (classButtons.length === 0) {
        debugLog('WARN: Keine .class-btn Elemente gefunden. Verwende Delegation am #menu Element. (Möglicher HTML-Fehler)');
      } else {
        debugLog(`Gefundene Klassenbuttons: ${classButtons.map(b => b.dataset.class).join(', ')}`);
      }

      // Sicherheitsfunktion: setze pointer-events und z-index, falls Menü von Canvas überdeckt wird
      // (Manchmal hängt ein Canvas mit höherem z-index über der UI; dieses stellt sicher dass UI klickbar ist)
      menuEl.style.pointerEvents = 'auto';
      menuEl.style.zIndex = 9999;
      briefingEl.style.zIndex = 9999;

      // --- Event-Handling: Klicks auf Klassen -----------------------------
      // 1) Falls classButtons vorhanden -> normale Listener
      if (classButtons.length > 0) {
        classButtons.forEach(btn => {
          // defensive: ensure dataset exists
          if (!btn.dataset || !btn.dataset.class) {
            debugLog(`WARN: Button ohne data-class gefunden: ${btn.outerHTML}`);
            return;
          }
          btn.addEventListener('click', (e) => {
            const clsName = btn.dataset.class;
            debugLog(`Button geklickt: ${clsName}`);
            handleClassSelection(clsName);
          });
          // Allow keyboard activation (Enter/Space)
          btn.addEventListener('keydown', (ev) => {
            if (ev.code === 'Enter' || ev.code === 'Space') {
              ev.preventDefault();
              const clsName = btn.dataset.class;
              debugLog(`Button (keyboard) aktiviert: ${clsName}`);
              handleClassSelection(clsName);
            }
          });
        });
      } else {
        // 2) Fallback: Event-Delegation auf Menu
        menuEl.addEventListener('click', (e) => {
          // climbed up to the button?
          let target = e.target;
          // find parent with class-btn
          while (target && target !== menuEl) {
            if (target.classList && target.classList.contains('class-btn')) {
              const clsName = target.dataset.class;
              debugLog(`Delegation: Klasse angeklickt: ${clsName}`);
              handleClassSelection(clsName);
              return;
            }
            target = target.parentNode;
          }
          debugLog('Delegation: Klick war kein class-btn.');
        });
      }

      // --- Handler: Auswahl einer Klasse -------------------------------
      function handleClassSelection(clsName) {
        if (!clsName || !classes[clsName]) {
          debugLog(`FEHLER: Ungültiger Klassename: ${String(clsName)}`);
          return;
        }
        selectedClass = clsName;
        debugLog(`Klasse ausgewählt: ${selectedClass}`);

        // Menü ausblenden, Briefing anzeigen
        menuEl.style.display = 'none';
        briefingEl.style.display = 'block';

        // Fülle Briefing-HTML (mit sicherer Text-Escape)
        const cls = classes[clsName];
        briefingEl.innerHTML = `
          <h2>${escapeHtml(clsName)}</h2>
          <p style="color:#ddd">${escapeHtml(cls.desc)}</p>
          <p style="color:#ffdca8"><strong>Fähigkeit:</strong> ${escapeHtml(cls.ability.name)} (Cooldown ${Math.round(cls.ability.cooldown/1000)}s)</p>
          <p style="color:#ccc; font-size:13px;"><strong>Leben:</strong> ${cls.health} • <strong>Speed:</strong> ${cls.speed} • <strong>Ammo:</strong> ${cls.ammo}</p>
          <button id="startGameBtn" role="button" aria-pressed="false">Los geht's!</button>
          <p style="font-size:12px; color:#999; margin-top:8px;">Hinweis: Falls PointerLock nicht startet, klicke einmal ins Spiel (Canvas).</p>
        `;

        // Set ARIA states for buttons (update)
        try {
          document.querySelectorAll('.class-btn').forEach(b => b.setAttribute('aria-pressed', b.dataset.class === clsName ? 'true' : 'false'));
        } catch (e) {}

        // Register start button listener (defensive: ensure element exists)
        const sbtn = document.getElementById('startGameBtn');
        if (!sbtn) {
          debugLog('FEHLER: Start-Button konnte nicht erzeugt werden (unexpected). Abbruch.');
          return;
        }
        sbtn.addEventListener('click', () => {
          debugLog('Start-Button gedrückt — starte Spiel...');
          briefingEl.style.display = 'none';
          startGame(selectedClass);
        });
      }

      // Small helper - escape html
      function escapeHtml(s) {
        return String(s).replace(/[&<>"']/g, (m) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[m]));
      }

      // --- Spielstart / initGame --------------------------------------
      // load Three.js inside DOMContentLoaded block and catch module load errors
      let THREE = null;
      let PointerLockControls = null;

      (async function loadThreeAndStart() {
        debugLog('Versuche, Three.js als Modul zu importieren...');
        try {
          // Import dynamic module (works if Webseite über http(s) oder lokaler dev-server läuft)
          const three = await import('https://cdn.jsdelivr.net/npm/three@0.148.0/build/three.module.js');
          THREE = three;
          debugLog('Three.js erfolgreich importiert.');
          const plcMod = await import('https://cdn.jsdelivr.net/npm/three@0.148.0/examples/jsm/controls/PointerLockControls.js');
          PointerLockControls = plcMod.PointerLockControls;
          debugLog('PointerLockControls importiert.');
        } catch (err) {
          debugLog('FEHLER: Three.js konnte nicht geladen werden. Prüfe Verbindung oder ob du per file:// öffnest. Fehler: ' + err, 'error');
          // Wir beenden hier nicht — Menü sollte trotzdem funktionieren. Aber renderloop wird fehlen.
        }
      })();

      // --- Spiel-Variablen (minimal, funktional) ---------------------
      let scene, camera, renderer, controls;
      let player = { health: 100, maxHealth: 100, speed: 400, ammo: 30, maxAmmo: 30, reloadTime: 2000, reloading:false, abilityNextUse: 0 };
      let level = 0;
      let enemies = [];
      let worldObstacles = [];
      let prevTime = performance.now();
      let moveForward=false, moveBackward=false, moveLeft=false, moveRight=false, sprint=false;

      // startGame: entry point — wird aufgerufen wenn Start-Button geklickt
      function startGame(clsName) {
        try {
          if (!clsName || !classes[clsName]) {
            debugLog('FEHLER: startGame aufgerufen mit ungültiger Klasse: ' + String(clsName), 'error');
            return;
          }
          debugLog('startGame -> Klasse: ' + clsName);
          // setze player stats
          const cls = classes[clsName];
          player.health = cls.health;
          player.maxHealth = cls.health;
          player.speed = cls.speed;
          player.ammo = cls.ammo;
          player.maxAmmo = cls.ammo;
          player.reloadTime = cls.reloadTime;
          player.abilityNextUse = 0;
          updateHUD();

          // init Three.js Szene (defensiv)
          if (!THREE) {
            debugLog('WARNUNG: Three.js nicht verfügbar — versuche synchronen Import als Fallback...', 'warn');
            // Fallback: versuche synchronous script injection (kann fehlschlagen bei CORS/file://)
            const s = document.createElement('script');
            s.src = 'https://cdn.jsdelivr.net/npm/three@0.148.0/build/three.min.js';
            s.onload = () => {
              debugLog('Fallback: three.min.js geladen (falls CDN erreichbar). Bitte Seite neu laden falls nötig.');
              // no guarantee PointerLockControls will be available
            };
            s.onerror = () => { debugLog('FEHLER: Fallback-Import für Three.js fehlgeschlagen.', 'error'); };
            document.head.appendChild(s);
          }

          // init scene and renderer (if not already)
          if (!scene) initGame(); // will also create renderer
          else {
            debugLog('Szene existiert bereits, setze Kamera und UI.');
          }

          // Force pointer lock request only on user gesture is allowed.
          // We request pointerlock now (start button click is a user gesture).
          requestPointerLockSafe();

        } catch (e) {
          debugLog('startGame fatal error: ' + e, 'error');
          console.error(e);
        }
      }

      // Safe pointer lock request
      function requestPointerLockSafe() {
        try {
          const el = document.body;
          if (el.requestPointerLock) {
            el.requestPointerLock();
            debugLog('PointerLock angefragt (document.body.requestPointerLock).');
          } else {
            debugLog('PointerLock API nicht vorhanden im Browser.', 'warn');
          }
        } catch (e) {
          debugLog('PointerLock Anfrage fehlgeschlagen: ' + e, 'error');
        }
      }

      // initGame: Erstellung von Szene, Kamera, Renderer, Controls
      function initGame() {
        if (!THREE) {
          debugLog('WARN: Three.js noch nicht geladen — initGame wartet nicht länger. Scene wird dennoch mit Feature-Limits gestartet.', 'warn');
          // Abbrechen, da keine WebGL-Funktionen vorhanden. Trotzdem versuch minimale UI-Änderung.
          createPlaceholderCanvas();
          return;
        }
        debugLog('initGame: Erstelle Scene, Kamera, Renderer');

        // Szene + Kamera
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x111217);
        camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 6, 18);

        // Licht
        const hemi = new THREE.HemisphereLight(0xffffee, 0x111122, 0.6);
        scene.add(hemi);
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
        dirLight.position.set(10, 20, 10);
        scene.add(dirLight);

        // Boden
        const floorGeo = new THREE.PlaneGeometry(300, 300);
        const floorMat = new THREE.MeshPhongMaterial({ color: 0x1a1a1a });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        floor.receiveShadow = true;
        scene.add(floor);

        // Renderer
        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio ? window.devicePixelRatio : 1);
        // clear container first (defensive)
        gameContainer.innerHTML = '';
        gameContainer.appendChild(renderer.domElement);
        debugLog('Renderer DOM-Element angehängt.');

        // Controls (PointerLock)
        controls = new PointerLockControls(camera, document.body);
        scene.add(controls.getObject());

        // Player Hitbox (invisible)
        const hitGeo = new THREE.SphereGeometry(0.6, 8, 8);
        const hitMat = new THREE.MeshBasicMaterial({ visible: false });
        const playerHitbox = new THREE.Mesh(hitGeo, hitMat);
        scene.add(playerHitbox);

        // Map (simple) - hilft beim Testen, dass etwas sichtbar ist
        buildSimpleTestMap();

        // Events
        window.addEventListener('resize', onWindowResize);
        document.addEventListener('keydown', onKeyDown);
        document.addEventListener('keyup', onKeyUp);
        document.addEventListener('mousedown', onMouseDown);

        // PointerLock event listeners — informativ
        document.addEventListener('pointerlockchange', () => {
          const locked = document.pointerLockElement === document.body;
          debugLog('pointerlockchange: ' + (locked ? 'locked' : 'unlocked'));
        });

        // Start anim loop
        prevTime = performance.now();
        animate();
      }

      // minimal placeholder canvas if Three.js not present
      function createPlaceholderCanvas() {
        gameContainer.innerHTML = '';
        const fallback = document.createElement('div');
        fallback.style.width = '100%';
        fallback.style.height = '100%';
        fallback.style.display = 'flex';
        fallback.style.alignItems = 'center';
        fallback.style.justifyContent = 'center';
        fallback.style.color = '#ddd';
        fallback.style.fontSize = '18px';
        fallback.textContent = 'Three.js konnte nicht geladen werden. Starte die Datei über einen lokalen Server (z. B. "npx http-server") und lade die Seite per http://localhost:8080';
        gameContainer.appendChild(fallback);
      }

      // Build a simple test map (few walls + crates) so we see something quickly
      function buildSimpleTestMap() {
        if (!THREE || !scene) return;
        // walls
        const wallMat = new THREE.MeshPhongMaterial({ color: 0x2b2b2b });
        const north = new THREE.Mesh(new THREE.BoxGeometry(200, 12, 2), wallMat);
        north.position.set(0,6,-100); scene.add(north); worldObstacles.push(north);
        const south = north.clone(); south.position.set(0,6,100); scene.add(south); worldObstacles.push(south);
        const east = new THREE.Mesh(new THREE.BoxGeometry(2, 12, 200), wallMat);
        east.position.set(100,6,0); scene.add(east); worldObstacles.push(east);
        const west = east.clone(); west.position.set(-100,6,0); scene.add(west); worldObstacles.push(west);

        // few crates
        for (let i=0;i<8;i++) {
          const crate = new THREE.Mesh(new THREE.BoxGeometry(4,4,4), new THREE.MeshPhongMaterial({ color: 0x6b5746 }));
          crate.position.set((Math.random()-0.5)*40, 2, (Math.random()-0.5)*40);
          scene.add(crate);
          worldObstacles.push(crate);
        }

        // small demo object to show center
        const center = new THREE.Mesh(new THREE.BoxGeometry(3,3,3), new THREE.MeshPhongMaterial({ color: 0x44aaff }));
        center.position.set(0,1.5,0); scene.add(center);
      }

      // Input handling
      function onKeyDown(e) {
        switch (e.code) {
          case 'KeyW': moveForward = true; break;
          case 'KeyA': moveLeft = true; break;
          case 'KeyS': moveBackward = true; break;
          case 'KeyD': moveRight = true; break;
          case 'ShiftLeft': sprint = true; break;
          case 'KeyR': /* reload */ break;
          case 'KeyF': /* ability */ break;
        }
      }
      function onKeyUp(e) {
        switch (e.code) {
          case 'KeyW': moveForward = false; break;
          case 'KeyA': moveLeft = false; break;
          case 'KeyS': moveBackward = false; break;
          case 'KeyD': moveRight = false; break;
          case 'ShiftLeft': sprint = false; break;
        }
      }
      function onMouseDown(e) {
        // If pointerlocked, allow shooting etc. If not, try to request pointer lock.
        if (document.pointerLockElement !== document.body) {
          debugLog('MouseDown: canvas nicht gesperrt — fordere PointerLock an (Benutzerinteraktion).');
          requestPointerLockSafe();
        } else {
          debugLog('MouseDown: pointer locked - hier würde ein Schuss ausgelöst werden.');
        }
      }

      // Resize handler
      function onWindowResize() {
        if (camera && renderer) {
          camera.aspect = window.innerWidth / window.innerHeight;
          camera.updateProjectionMatrix();
          renderer.setSize(window.innerWidth, window.innerHeight);
          debugLog('Fenstergröße angepasst.');
        }
      }

      // Animate loop (simple)
      function animate() {
        requestAnimationFrame(animate);
        const now = performance.now();
        const delta = (now - prevTime) / 1000;
        prevTime = now;

        // simple movement demonstration only if controls exist and locked
        if (controls && controls.isLocked) {
          const actualSpeed = player.speed * (sprint ? 1.6 : 1.0);
          if (moveForward) controls.moveForward(actualSpeed * delta);
          if (moveBackward) controls.moveForward(-actualSpeed * delta);
          if (moveLeft) controls.moveRight(-actualSpeed * delta);
          if (moveRight) controls.moveRight(actualSpeed * delta);
        }

        // render
        if (renderer && scene && camera) {
          renderer.render(scene, camera);
        }
      }

      // HUD update helper
      function updateHUD() {
        healthEl.innerText = 'Leben: ' + Math.max(0, Math.round(player.health));
        ammoEl.innerText = 'Munition: ' + (player.reloading ? 'Nachladen...' : (player.ammo + '/' + player.maxAmmo));
        infoEl.innerText = 'Klasse: ' + (selectedClass ?? '-') + ' | Level: ' + level + ' | Gegner: ' + enemies.length;
        const cls = selectedClass ? classes[selectedClass] : null;
        const now = performance.now();
        const cd = cls ? Math.max(0, Math.round((player.abilityNextUse - now)/1000)) : 0;
        abilityEl.innerText = cls ? `Fähigkeit: ${cls.ability.name} ${cd>0?`(CD ${cd}s)`:''}` : 'Fähigkeit: -';
      }

      // initial HUD update
      updateHUD();

      // --- End of DOMContentLoaded handler --------------------------------
      debugLog('Initialisierung abgeschlossen. Menü ist bereit.');
    }); // DOMContentLoaded end
  </script>
</body>
</html>
