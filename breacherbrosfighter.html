<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BreacherBros 3D Browsergame</title>
  <style>
    :root {
      --color-orange: #FF6B00;
      --color-turquoise: #00FFD5;
      --color-purple: #8F00FF;
      --bg-dark: #000000;
    }
    body {
      margin: 0; padding: 0;
      background: var(--bg-dark);
      color: #FFF;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }
    .neon {
      color: #fff;
      text-shadow:
        0 0 5px currentColor,
        0 0 10px currentColor,
        0 0 20px currentColor;
    }
    .screen {
      position: absolute; top: 0; left: 0;
      width: 100%; height: 100%;
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      background: var(--bg-dark);
    }
    #briefing-screen, #game-screen {
      display: none;
    }
    .class-option {
      border: 2px solid #666;
      border-radius: 8px;
      padding: 10px;
      margin: 5px;
      width: 200px;
      cursor: pointer;
      background: rgba(255,255,255,0.1);
      transition: background 0.3s, border-color 0.3s;
      text-align: center;
    }
    .class-option:hover { background: rgba(255,255,255,0.2); }
    .class-option.selected {
      border-color: #FFF;
      background: rgba(255,255,255,0.2);
    }
    .class-option input { display: none; }
    button {
      padding: 10px 20px;
      font-size: 18px;
      margin: 10px;
      cursor: pointer;
      border: 2px solid #FFF;
      background: transparent;
      color: #FFF;
      border-radius: 5px;
      transition: background 0.3s;
    }
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    button:hover:not(:disabled) {
      background: rgba(255,255,255,0.2);
    }
    #hud {
      position: absolute; top: 10px; left: 10px;
      font-size: 18px;
    }
    canvas { display: block; }
  </style>
</head>
<body>

  <!-- Startbildschirm -->
  <div id="start-screen" class="screen">
    <h1 class="neon">BreacherBros</h1>
    <h2 class="neon">Wähle deine Klasse</h2>
    <div id="class-options">
      <label class="class-option" id="option-assault">
        <input type="radio" name="class" value="Assault">
        <h3>Assault (Allrounder)</h3>
        <p>HP: 100, Speed: 5, Magazin: 30, Feuerrate: 0.20</p>
      </label>
      <label class="class-option" id="option-breacher">
        <input type="radio" name="class" value="Breacher">
        <h3>Breacher (Panzer)</h3>
        <p>HP: 150, Speed: 3, Magazin: 30, Feuerrate: 0.15</p>
      </label>
      <label class="class-option" id="option-scout">
        <input type="radio" name="class" value="Scout">
        <h3>Scout (Speed)</h3>
        <p>HP: 75, Speed: 8, Magazin: 20, Feuerrate: 0.30</p>
      </label>
      <label class="class-option" id="option-engineer">
        <input type="radio" name="class" value="Engineer">
        <h3>Engineer (Werkzeuge)</h3>
        <p>HP: 100, Speed: 4, Magazin: 50, Feuerrate: 0.10</p>
      </label>
      <label class="class-option" id="option-sniper">
        <input type="radio" name="class" value="Sniper">
        <h3>Sniper (Reichweite)</h3>
        <p>HP: 80, Speed: 3, Magazin: 10, Feuerrate: 0.50</p>
      </label>
    </div>
    <button id="start-button" disabled>Start Mission</button>
  </div>

  <!-- Briefing-Screen -->
  <div id="briefing-screen" class="screen">
    <h1 id="missionTitle">Mission Briefing</h1>
    <p id="classIntro"></p>
    <p id="missionDesc"></p>
    <button id="go-button">Los geht's!</button>
  </div>

  <!-- 3D-Spiel-Screen -->
  <div id="game-screen">
    <canvas id="gameCanvas"></canvas>
    <div id="hud"></div>
  </div>

  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';
    import { PointerLockControls } from 'https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/controls/PointerLockControls.js';

    // Klassen-Definitionen
    const classes = {
      Assault: { hp:100, speed:5,  mag:30, rate:0.20, color:'#FF6B00', intro:'Allrounder' },
      Breacher: { hp:150, speed:3,  mag:30, rate:0.15, color:'#8F00FF', intro:'Panzer' },
      Scout:   { hp:75,  speed:8,  mag:20, rate:0.30, color:'#00FFD5', intro:'Speed' },
      Engineer:{ hp:100, speed:4,  mag:50, rate:0.10, color:'#00FFD5', intro:'Werkzeuge' },
      Sniper:  { hp:80,  speed:3,  mag:10, rate:0.50, color:'#8F00FF', intro:'Reichweite' }
    };
    let selectedClass = null;

    // Klasse auswählen
    const options = document.querySelectorAll('.class-option');
    options.forEach(opt => {
      opt.addEventListener('click', () => {
        options.forEach(o => o.classList.remove('selected'));
        opt.classList.add('selected');
        opt.querySelector('input').checked = true;
        selectedClass = opt.querySelector('input').value;
        document.getElementById('start-button').disabled = false;
      });
    });

    // Start Mission
    document.getElementById('start-button').addEventListener('click', () => {
      if(!selectedClass) return;
      document.getElementById('start-screen').style.display = 'none';
      const cls = classes[selectedClass];
      // Briefing-Text einfügen
      document.getElementById('classIntro').textContent =
        `Du hast die Klasse ${selectedClass} (${cls.intro}) gewählt.`;
      document.getElementById('classIntro').style.color = cls.color;
      // Kurze Missionsbeschreibung
      const missions = {
        Assault: 'Ausgeglichenes Gefecht (Infiltration)',
        Breacher: 'Starker Durchbruch',
        Scout: 'Schnelle Vorhut',
        Engineer: 'Technische Infiltration',
        Sniper: 'Präzisionsschussmission'
      };
      document.getElementById('missionDesc').textContent = missions[selectedClass];
      document.getElementById('missionDesc').style.color = cls.color;
      document.getElementById('missionTitle').style.color = cls.color;
      document.getElementById('briefing-screen').style.display = 'flex';
    });

    // Beep-Geräusch (kurzer Piepton):contentReference[oaicite:7]{index=7}
    function playBeep() {
      const audioCtx = new AudioContext();
      const osc = audioCtx.createOscillator();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(440, audioCtx.currentTime);
      osc.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.1);
    }

    // 3D-Spiel starten
    document.getElementById('go-button').addEventListener('click', () => {
      document.getElementById('briefing-screen').style.display = 'none';
      document.getElementById('game-screen').style.display = 'block';
      playBeep();
      initGame();
    });

    // Three.js Szene initialisieren
    let camera, scene, renderer, controls;
    let moveForward=false, moveBackward=false, moveLeft=false, moveRight=false;
    const clock = new THREE.Clock();

    function initGame() {
      // Renderer und Szene
      const canvas = document.getElementById('gameCanvas');
      renderer = new THREE.WebGLRenderer({ canvas });
      renderer.setSize(window.innerWidth, window.innerHeight);
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x000000);
      camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
      camera.position.set(0, 2, 0);

      // Licht
      scene.add(new THREE.AmbientLight(0xffffff, 0.5));
      const light = new THREE.DirectionalLight(0xffffff, 1);
      light.position.set(0,10,0);
      scene.add(light);

      // Boden
      const ground = new THREE.Mesh(
        new THREE.PlaneGeometry(100, 100),
        new THREE.MeshStandardMaterial({ color: 0x333333 })
      );
      ground.rotation.x = -Math.PI/2;
      scene.add(ground);

      // Beispiel-Objekt (Würfel)
      const cube = new THREE.Mesh(
        new THREE.BoxGeometry(1,1,1),
        new THREE.MeshStandardMaterial({ color: 0xFF0000 })
      );
      cube.position.set(0, 0.5, -5);
      scene.add(cube);

      // Pointer Lock Controls für First-Person-Steuerung:contentReference[oaicite:8]{index=8}
      controls = new PointerLockControls(camera, document.body);
      document.body.addEventListener('click', () => {
        if (!controls.isLocked) controls.lock();
      });

      // Tastatureingabe (WASD & Shift)
      const onKeyDown = (e) => {
        if (e.code === 'KeyW' || e.code === 'ArrowUp')    moveForward = true;
        if (e.code === 'KeyS' || e.code === 'ArrowDown')  moveBackward = true;
        if (e.code === 'KeyA' || e.code === 'ArrowLeft')  moveLeft = true;
        if (e.code === 'KeyD' || e.code === 'ArrowRight') moveRight = true;
        if (e.code === 'ShiftLeft' || e.code === 'ShiftRight') {
          classes[selectedClass].origSpeed = classes[selectedClass].speed;
          classes[selectedClass].speed *= 2;
        }
      };
      const onKeyUp = (e) => {
        if (e.code === 'KeyW' || e.code === 'ArrowUp')    moveForward = false;
        if (e.code === 'KeyS' || e.code === 'ArrowDown')  moveBackward = false;
        if (e.code === 'KeyA' || e.code === 'ArrowLeft')  moveLeft = false;
        if (e.code === 'KeyD' || e.code === 'ArrowRight') moveRight = false;
        if (e.code === 'ShiftLeft' || e.code === 'ShiftRight') {
          classes[selectedClass].speed = classes[selectedClass].origSpeed;
        }
      };
      document.addEventListener('keydown', onKeyDown);
      document.addEventListener('keyup', onKeyUp);

      // Anzeige der Spielerwerte (HUD)
      const hud = document.getElementById('hud');
      const cls = classes[selectedClass];
      hud.innerHTML = 
        `Klasse: ${selectedClass} (${cls.intro})<br>` +
        `Level: 1<br>` +
        `HP: ${cls.hp} | Speed: ${cls.speed} | Magazin: ${cls.mag} | Feuerrate: ${cls.rate}`;

      animate();
    }

    function animate() {
      requestAnimationFrame(animate);
      const delta = clock.getDelta();
      if (controls.isLocked) {
        const velocity = classes[selectedClass].speed;
        if (moveForward)  controls.moveForward(velocity * delta);
        if (moveBackward) controls.moveForward(-velocity * delta);
        if (moveLeft)     controls.moveRight(-velocity * delta);
        if (moveRight)    controls.moveRight(velocity * delta);
      }
      renderer.render(scene, camera);
    }

    // Fenster-Resize anpassen
    window.addEventListener('resize', () => {
      if (camera && renderer) {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      }
    });
  </script>
</body>
</html>
