<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>BreacherBros - Startbildschirm</title>
  <!-- Three.js CDN als einzige externe Abhängigkeit -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r150/three.min.js"></script>
  <style>
    body {
      margin: 0; padding: 0;
      background-color: #000;
      color: #fff;
      font-family: Arial, sans-serif;
      text-align: center;
    }
    .screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
      box-sizing: border-box;
    }
    /* Titel-Styling */
    #startScreen h1 {
      margin-bottom: 30px;
      color: #FF8C00;
      font-size: 3em;
      text-shadow: 0 0 10px #FF8C00; /* Neon-Orange-Glow */
    }
    #briefingScreen h1 {
      color: #40E0D0;
      font-size: 2.5em;
      margin-bottom: 20px;
      text-shadow: 0 0 10px #40E0D0; /* Neon-Türkis-Glow */
    }
    /* Klassen-Karten Container */
    .classes {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      margin-bottom: 30px;
      width: 100%;
      max-width: 800px;
    }
    .class-card {
      flex: 1 1 200px;
      max-width: 250px;
      background-color: #111;
      padding: 20px;
      border: 2px solid transparent;
      border-radius: 10px;
      cursor: pointer;
      transition: transform 0.2s;
    }
    .class-card:hover {
      transform: scale(1.05);
    }
    .class-card h2 {
      margin: 10px 0;
      font-size: 1.5em;
    }
    .class-card p {
      margin: 0;
      color: #ccc;
    }
    /* Neon-Farben für die Klassennamen */
    .class-card.soldat h2 {
      color: #FF8C00;
      text-shadow: 0 0 5px #FF8C00;
    }
    .class-card.spion h2 {
      color: #40E0D0;
      text-shadow: 0 0 5px #40E0D0;
    }
    .class-card.techniker h2 {
      color: #9400D3;
      text-shadow: 0 0 5px #9400D3;
    }
    /* Hervorhebung ausgewählter Karte */
    .class-card.selected {
      border-color: #fff;
      box-shadow: 0 0 10px #fff, 0 0 20px #fff;
    }
    .class-card.soldat.selected {
      border-color: #FF8C00;
      box-shadow: 0 0 10px #FF8C00, 0 0 20px #FF8C00;
    }
    .class-card.spion.selected {
      border-color: #40E0D0;
      box-shadow: 0 0 10px #40E0D0, 0 0 20px #40E0D0;
    }
    .class-card.techniker.selected {
      border-color: #9400D3;
      box-shadow: 0 0 10px #9400D3, 0 0 20px #9400D3;
    }
    /* Start-Button Styling */
    #startBtn {
      padding: 10px 20px;
      font-size: 1.2em;
      font-weight: bold;
      border: 2px solid #FF8C00;
      border-radius: 5px;
      background: none;
      color: #FF8C00;
      text-shadow: 0 0 5px #FF8C00;
      cursor: pointer;
      transition: background-color 0.3s, color 0.3s;
    }
    #startBtn:hover:not(:disabled) {
      background-color: #FF8C00;
      color: #000;
      text-shadow: none;
    }
    #startBtn:disabled {
      opacity: 0.5;
      border-color: #444;
      color: #444;
      cursor: not-allowed;
      text-shadow: none;
    }
    /* Briefing Screen (zunächst versteckt) */
    #briefingScreen {
      display: none;
    }
    #briefingScreen p {
      text-shadow: 0 0 3px #fff;
    }
  </style>
</head>
<body>

<div id="startScreen" class="screen">
  <h1>BreacherBros – Klassenwahl</h1>
  <div class="classes">
    <div class="class-card soldat" data-klassenname="Soldat">
      <h2>Soldat</h2>
      <p>Stärke 8, Ausdauer 6, Technik 2</p>
    </div>
    <div class="class-card spion" data-klassenname="Spion">
      <h2>Spion</h2>
      <p>Stärke 3, Ausdauer 7, Technik 9</p>
    </div>
    <div class="class-card techniker" data-klassenname="Techniker">
      <h2>Techniker</h2>
      <p>Stärke 4, Ausdauer 5, Technik 9</p>
    </div>
  </div>
  <button id="startBtn" disabled>Mission starten</button>
</div>

<div id="briefingScreen" class="screen">
  <h1>Einsatz-Briefing</h1>
  <p>Die Mission wird vorbereitet...<br>Kartenauswahl und Ziele werden geladen.</p>
</div>

<script>
  // Auswahl-Handler: Klick auf Klassen-Karte
  document.querySelectorAll('.class-card').forEach(card => {
    card.addEventListener('click', () => {
      // Alle anderen Karten zurücksetzen
      document.querySelectorAll('.class-card').forEach(c => c.classList.remove('selected'));
      // Diese Karte markieren
      card.classList.add('selected');
      // Start-Button aktivieren (disabled = false):contentReference[oaicite:3]{index=3}
      document.getElementById('startBtn').disabled = false;
    });
  });
  // Handler für Start-Button
  document.getElementById('startBtn').addEventListener('click', () => {
    // Starte Mission: Bildschirm wechseln
    document.getElementById('startScreen').style.display = 'none';
    document.getElementById('briefingScreen').style.display = 'flex';
  });
</script>

</body>
</html>
