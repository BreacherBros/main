<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>R6 Operator Stats</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: "Segoe UI", sans-serif;
      background: radial-gradient(circle at top, #0b1020, #05060a 70%);
      color: white;
    }

    .mode-switch {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin: 20px;
    }

    .mode-switch button {
      padding: 10px 20px;
      border: none;
      background: #111;
      color: #aaa;
      cursor: pointer;
      border-radius: 6px;
    }

    .mode-switch .active {
      background: #00c3ff;
      color: black;
    }

    .operators-grid {
      display: flex;
      justify-content: center;
      gap: 25px;
      margin-top: 40px;
      flex-wrap: wrap;
    }

    .operator-card {
      background: linear-gradient(160deg, rgba(20,25,40,0.95), rgba(10,15,30,0.95));
      border-radius: 16px;
      padding: 22px;
      width: 260px;

      border: 1px solid rgba(255,255,255,0.08);
      backdrop-filter: blur(10px);

      transition: all 0.3s ease;

      position: relative;
      overflow: hidden;
    }

    .operator-card:hover {
      transform: translateY(-6px) scale(1.02);
    }

    .operator-card::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 16px;
      background: linear-gradient(120deg, transparent, rgba(255,255,255,0.15), transparent);
      opacity: 0.2;
    }

    .rank-text {
      font-size: 18px;
      font-weight: bold;
      letter-spacing: 1px;
    }

    .progress-bar {
      height: 6px;
      background: rgba(255,255,255,0.08);
      border-radius: 6px;
      overflow: hidden;
      margin: 10px 0;
    }

    .progress-fill {
      height: 100%;
      border-radius: 6px;
      transition: width 0.4s ease;
    }

    .kd {
      font-size: 26px;
      font-weight: bold;
      margin: 10px 0;
    }
  </style>
</head>

<body>

<div class="mode-switch">
  <button id="rankedBtn" class="active">RANKED</button>
  <button id="casualBtn">UNRANKED</button>
</div>

<div class="operators-grid" id="players"></div>

<script>
const API = "https://r6-api-backend.onrender.com/api/stats";
let currentMode = "ranked";

/* SWITCH */
document.getElementById("rankedBtn").onclick = () => {
  currentMode = "ranked";
  setActive("rankedBtn");
  loadStats();
};

document.getElementById("casualBtn").onclick = () => {
  currentMode = "casual";
  setActive("casualBtn");
  loadStats();
};

function setActive(id) {
  rankedBtn.classList.remove("active");
  casualBtn.classList.remove("active");
  document.getElementById(id).classList.add("active");
}

/* 🔥 RANK SYSTEM (EXACT) */
function getRankFromMMR(mmr) {
  if (!mmr || mmr === 0) {
    return { name: "UNRANKED", color: "#777", progress: 0 };
  }

  if (mmr >= 5000) {
    return { name: "CHAMPION", color: "#ff0033", progress: 100 };
  }

  const ranks = [
    { name: "KUPFER", color: "#cd7f32" },
    { name: "BRONZE", color: "#a97142" },
    { name: "SILBER", color: "#c0c0c0" },
    { name: "GOLD", color: "#ffd700" },
    { name: "PLATIN", color: "#4fc3f7" },
    { name: "SMARAGD", color: "#00ff88" },
    { name: "DIAMANT", color: "#00e5ff" }
  ];

  const base = Math.floor(mmr / 500);
  const index = Math.max(0, Math.min(base - 2, ranks.length - 1));
  const rank = ranks[index];

  const division = 5 - Math.floor((mmr % 500) / 100);
  const progress = (mmr % 100) / 100 * 100;

  return {
    name: `${rank.name} ${division}`,
    color: rank.color,
    progress
  };
}

/* HELPERS */
function getKDColor(kd) {
  if (!kd) return "#aaa";
  kd = parseFloat(kd);

  if (kd >= 1.5) return "#00ff88";
  if (kd >= 1.2) return "#4caf50";
  if (kd >= 1.0) return "#ff9800";
  return "#f44336";
}

function getWinrate(w, l) {
  if (!w || !l) return "-";
  return ((w / (w + l)) * 100).toFixed(1);
}

async function fetchPlayer(name) {
  const res = await fetch(
    `${API}?nameOnPlatform=${encodeURIComponent(name)}&platformType=psn`
  );

  const data = await res.json();

  return currentMode === "ranked"
    ? data.ranked
    : data.casual;
}

/* RENDER */
function render(p) {
  if (!p) return `<div class="operator-card">NO DATA</div>`;

  const rank = getRankFromMMR(p.mmr);

  return `
    <div class="operator-card" style="
      box-shadow: 0 0 25px ${rank.color}55,
                  inset 0 0 15px rgba(255,255,255,0.05);
    ">

      <div class="rank-text" style="color:${rank.color}">
        ${rank.name}
      </div>

      <div>${p.mmr || 0} MMR</div>

      <div class="progress-bar">
        <div class="progress-fill" 
             style="width:${rank.progress}%; background:${rank.color}">
        </div>
      </div>

      <div class="kd" style="color:${getKDColor(p.kd)}">
        ${p.kd || "0.00"} KD
      </div>

      <div>Winrate: ${getWinrate(p.wins, p.losses)}%</div>

      <div>Kills: ${p.kills}</div>
      <div>Deaths: ${p.deaths}</div>

    </div>
  `;
}

/* LOAD */
async function loadStats() {
  const el = document.getElementById("players");
  el.innerHTML = "Loading...";

  const [p1, p2] = await Promise.all([
    fetchPlayer("BB_Pater_Odor"),
    fetchPlayer("SomaRay_Jr")
  ]);

  el.innerHTML = render(p1) + render(p2);
}

loadStats();
</script>

</body>
</html>
