<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>R6 Operator Stats</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: radial-gradient(circle at top, #0b1020, #05060a 70%);
  color: white;
}

/* HEADER */
header {
  text-align: center;
  margin-top: 40px;
}

header h1 {
  letter-spacing: 2px;
}

header span {
  color: #aaa;
}

/* BUTTONS */
.mode-switch {
  display: flex;
  justify-content: center;
  gap: 10px;
  margin: 20px;
}

.mode-switch button {
  padding: 10px 20px;
  border: none;
  background: #111;
  color: #aaa;
  border-radius: 6px;
  cursor: pointer;
}

.mode-switch .active {
  background: #00c3ff;
  color: black;
}

/* CARDS */
.operators-grid {
  display: flex;
  justify-content: center;
  gap: 30px;
  margin-top: 40px;
}

.operator-card {
  background: linear-gradient(160deg, rgba(30,40,70,0.9), rgba(10,15,30,0.9));
  border-radius: 14px;
  padding: 20px;
  width: 300px;
  transition: 0.3s;
}

.operator-card:hover {
  transform: translateY(-5px);
}

/* NAME */
.player-name {
  font-size: 20px;
  font-weight: bold;
  margin-bottom: 10px;
}

/* RANK */
.rank {
  font-weight: bold;
  margin-bottom: 5px;
}

/* KD */
.kd {
  font-size: 22px;
  font-weight: bold;
  margin: 10px 0;
}

/* STATS */
.stat {
  font-size: 14px;
  color: #ccc;
}
</style>
</head>

<body>

<header>
  <h1>R6 OPERATOR STATS</h1>
  <span>LIVE COMBAT DATA</span>
</header>

<div class="mode-switch">
  <button id="rankedBtn" class="active">RANKED</button>
  <button id="casualBtn">UNRANKED</button>
</div>

<div class="operators-grid" id="players"></div>

<script>
const API = "https://r6-api-backend.onrender.com/api/stats";
let currentMode = "ranked";

/* SWITCH */
rankedBtn.onclick = () => {
  currentMode = "ranked";
  setActive("rankedBtn");
  loadStats();
};

casualBtn.onclick = () => {
  currentMode = "casual";
  setActive("casualBtn");
  loadStats();
};

function setActive(id) {
  rankedBtn.classList.remove("active");
  casualBtn.classList.remove("active");
  document.getElementById(id).classList.add("active");
}

/* 🔥 RANK SYSTEM (5 DIVISIONS) */
function getRankFromMMR(mmr) {
  if (!mmr) return { name: "UNRANKED", color: "#777" };

  if (mmr >= 5000) return { name: "CHAMPION", color: "#ff0033" };

  const ranks = [
    { name: "KUPFER", color: "#cd7f32" },
    { name: "BRONZE", color: "#a97142" },
    { name: "SILBER", color: "#c0c0c0" },
    { name: "GOLD", color: "#ffd700" },
    { name: "PLATIN", color: "#4fc3f7" },
    { name: "SMARAGD", color: "#00ff88" },
    { name: "DIAMANT", color: "#00e5ff" }
  ];

  const base = Math.floor(mmr / 500);
  const index = Math.max(0, Math.min(base - 2, ranks.length - 1));
  const rank = ranks[index];

  const division = 5 - Math.floor((mmr % 500) / 100);

  return {
    name: `${rank.name} ${division}`,
    color: rank.color
  };
}

/* HELPERS */
function getKDColor(kd) {
  if (!kd) return "#aaa";
  kd = parseFloat(kd);
  if (kd >= 1.5) return "#00ff88";
  if (kd >= 1.2) return "#4caf50";
  if (kd >= 1.0) return "#ff9800";
  return "#f44336";
}

function getWinrate(w, l) {
  if (!w || !l) return "-";
  return ((w / (w + l)) * 100).toFixed(1);
}

/* FETCH */
async function fetchPlayer(name) {
  const res = await fetch(
    `${API}?nameOnPlatform=${encodeURIComponent(name)}&platformType=psn`
  );

  const data = await res.json();

  return currentMode === "ranked"
    ? data.ranked
    : data.casual;
}

/* RENDER */
function render(p) {
  if (!p) return `<div class="operator-card">NO DATA</div>`;

  const rank = getRankFromMMR(p.mmr);

  return `
    <div class="operator-card" style="box-shadow: 0 0 15px ${rank.color}55">

      <div class="player-name">
        ${p.username || "-"}
      </div>

      <div class="rank" style="color:${rank.color}">
        ${rank.name} • ${p.mmr || 0} MMR
      </div>

      <div class="kd" style="color:${getKDColor(p.kd)}">
        ${p.kd || "0.00"} KD
      </div>

      <div class="stat">Winrate: ${getWinrate(p.wins, p.losses)}%</div>

      <div class="stat">Kills: ${p.kills}</div>
      <div class="stat">Deaths: ${p.deaths}</div>
      <div class="stat">Wins: ${p.wins}</div>
      <div class="stat">Losses: ${p.losses}</div>

    </div>
  `;
}

/* LOAD */
async function loadStats() {
  const el = document.getElementById("players");
  el.innerHTML = "Loading...";

  const [p1, p2] = await Promise.all([
    fetchPlayer("BB_Pater_Odor"),
    fetchPlayer("SomaRay_Jr")
  ]);

  el.innerHTML = render(p1) + render(p2);
}

loadStats();
</script>

</body>
</html>
