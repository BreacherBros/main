<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>R6 Operator Stats</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="./style.css">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
</head>

<body>

<header class="hud-header">
  <h1>R6 OPERATOR STATS</h1>
</header>

<div class="search-box">
  <input id="playerInput" placeholder="Gamertag eingeben">
  <select id="platformSelect">
    <option value="psn">PSN</option>
    <option value="uplay">UBISOFT</option>
  </select>
  <button onclick="searchPlayer()">ADD PLAYER</button>
</div>

<div class="mode-switch">
  <button id="rankedBtn" class="active">RANKED</button>
  <button id="casualBtn">UNRANKED</button>
</div>

<div id="players"></div>

<script>
const API = "https://r6-api-backend.onrender.com/api/stats";

const rankedBtn = document.getElementById("rankedBtn");
const casualBtn = document.getElementById("casualBtn");
const playerInput = document.getElementById("playerInput");
const platformSelect = document.getElementById("platformSelect");

let currentMode = "ranked";

let players = [
  {
    names: { psn: "BB_Pater_Odor", uplay: "BB_Pater_Odor" },
    platform: "psn"
  },
  {
    names: { psn: "SomaRay_Jr", uplay: "BB_SomaRay" },
    platform: "psn"
  }
];

/* MODE */
rankedBtn.onclick = () => {
  currentMode = "ranked";
  loadStats();
};

casualBtn.onclick = () => {
  currentMode = "casual";
  loadStats();
};

/* ADD PLAYER */
function searchPlayer() {
  const name = playerInput.value.trim();
  const platform = platformSelect.value;

  if (!name) return;

  players.push({
    names: { psn: name, uplay: name },
    platform
  });

  playerInput.value = "";
  loadStats();
}

/* FETCH */
async function fetchPlayer(p) {
  try {
    const name = p.names[p.platform];

    const res = await fetch(
      `${API}?nameOnPlatform=${encodeURIComponent(name)}&platformType=${p.platform}`
    );

    const data = await res.json();

    console.log("API DATA:", data);

    const modeData = currentMode === "ranked"
      ? data.ranked
      : data.casual;

    return {
      ...modeData,

      /* 🔥 PEAK KOMMT IMMER AUS RANKED */
      bestRank: data.ranked?.bestRank,
      bestMMR: data.ranked?.bestMMR,
      bestRankColor: data.ranked?.bestRankColor || "#ffd700"
    };

  } catch (err) {
    console.error("Fetch Fehler:", err);
    return null;
  }
}

/* RENDER */
function render(p) {
  if (!p) return `<div>NO DATA</div>`;

  return `
    <div style="border:1px solid #444; padding:15px; margin:10px;">
      <h2>${p.username}</h2>

      <div>MMR: ${p.mmr || 0}</div>

      ${
        p.bestMMR
          ? `<div style="color:${p.bestRankColor}">
               🏆 ${p.bestRank} • ${p.bestMMR}
             </div>`
          : ""
      }

      <div>KD: ${p.kd || "0.00"}</div>
    </div>
  `;
}

/* LOAD */
async function loadStats() {
  const el = document.getElementById("players");
  el.innerHTML = "Loading...";

  const results = [];

  for (const p of players) {
    results.push(await fetchPlayer(p));
  }

  el.innerHTML = results.map(render).join("");
}

loadStats();
</script>

</body>
</html>
