<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>R6 Operator Stats</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- ✅ DEIN NEUER CSS -->
<link rel="stylesheet" href="./style.css">

</head>

<body>

<!-- 🔥 SMOKE BACKGROUND -->
<div id="smoke-bg">
  <div class="fog-layer"></div>
  <div class="energy-layer"></div>
  <div class="noise-layer"></div>
  <div class="parallax-layer"></div>
</div>

<header class="hud-header">
  <h1>R6 OPERATOR STATS</h1>
  <span class="hud-sub">LIVE COMBAT DATA</span>
</header>

<!-- 🔍 SEARCH -->
<div class="search-box">
  <input id="playerInput" placeholder="Gamertag eingeben">
  
  <select id="platformSelect">
    <option value="psn">PSN</option>
    <option value="uplay">UBISOFT</option>
  </select>

  <button onclick="searchPlayer()">ADD PLAYER</button>
</div>

<!-- 🔁 MODE SWITCH -->
<div class="mode-switch">
  <button id="rankedBtn" class="active">RANKED</button>
  <button id="casualBtn">UNRANKED</button>
</div>

<main class="hud-dashboard">
  <div class="operators-grid" id="players"></div>
</main>

<script>
const API = "https://r6-api-backend.onrender.com/api/stats";

let currentMode = "ranked";

/* 🔥 DEFAULT PLAYERS */
let players = [
  { name: "BB_Pater_Odor", platform: "psn" },
  { name: "SomaRay_Jr", platform: "psn" }
];

/* SWITCH */
rankedBtn.onclick = () => {
  currentMode = "ranked";
  setActive("rankedBtn");
  loadStats();
};

casualBtn.onclick = () => {
  currentMode = "casual";
  setActive("casualBtn");
  loadStats();
};

function setActive(id) {
  rankedBtn.classList.remove("active");
  casualBtn.classList.remove("active");
  document.getElementById(id).classList.add("active");
}

/* ADD PLAYER */
function searchPlayer() {
  const name = document.getElementById("playerInput").value;
  const platform = document.getElementById("platformSelect").value;

  if (!name) return;

  players.push({ name, platform });
  loadStats();
}

/* 🎯 RANK SYSTEM (5 DIVISIONS) */
function getRankFromMMR(mmr) {
  if (!mmr) return { name: "UNRANKED", color: "#777" };

  const tiers = [
    { name: "Copper", color: "#cd7f32" },
    { name: "Bronze", color: "#a97142" },
    { name: "Silver", color: "#c0c0c0" },
    { name: "Gold", color: "#ffd700" },
    { name: "Platinum", color: "#4fc3f7" },
    { name: "Emerald", color: "#00ff88" },
    { name: "Diamond", color: "#00e5ff" }
  ];

  let tierIndex = Math.floor(mmr / 500) - 2;
  tierIndex = Math.max(0, Math.min(tierIndex, tiers.length - 1));

  const division = 5 - Math.floor((mmr % 500) / 100);

  return {
    name: `${tiers[tierIndex].name} ${division}`,
    color: tiers[tierIndex].color
  };
}

/* KD COLOR */
function getKDColor(kd) {
  if (!kd) return "#aaa";
  kd = parseFloat(kd);

  if (kd >= 1.5) return "#00ff88";
  if (kd >= 1.2) return "#4caf50";
  if (kd >= 1.0) return "#ff9800";
  return "#f44336";
}

/* WINRATE */
function getWinrate(w, l) {
  if (!w || !l) return "-";
  return ((w / (w + l)) * 100).toFixed(1);
}

/* FETCH */
async function fetchPlayer(p) {
  try {
    const res = await fetch(
      `${API}?nameOnPlatform=${encodeURIComponent(p.name)}&platformType=${p.platform}`
    );

    const data = await res.json();

    return currentMode === "ranked"
      ? data.ranked
      : data.casual;

  } catch (err) {
    console.error(err);
    return null;
  }
}

/* RENDER */
function render(p, glowClass) {
  if (!p) return `<div class="operator-card">NO DATA</div>`;

  const rank = getRankFromMMR(p.mmr);

  return `
    <div class="operator-card ${glowClass}" style="box-shadow:0 0 40px ${rank.color}33">

      <div class="operator-header">
        <div class="operator-name">${p.username || "-"}</div>
        <div class="operator-tag">${p.platform}</div>
      </div>

      <div class="rank" style="color:${rank.color}">
        ${rank.name} • ${p.mmr || 0} MMR
      </div>

      <div class="kd-value" style="color:${getKDColor(p.kd)}">
        ${p.kd || "0.00"} KD
      </div>

      <div class="section-title">COMBAT</div>

      <div class="stats-grid">
        <div class="stat-box">
          <div class="stat-label">WINRATE</div>
          <div class="stat-value">${getWinrate(p.wins, p.losses)}%</div>
        </div>

        <div class="stat-box">
          <div class="stat-label">KILLS</div>
          <div class="stat-value">${p.kills ?? "-"}</div>
        </div>

        <div class="stat-box">
          <div class="stat-label">DEATHS</div>
          <div class="stat-value">${p.deaths ?? "-"}</div>
        </div>

        <div class="stat-box">
          <div class="stat-label">WINS</div>
          <div class="stat-value">${p.wins ?? "-"}</div>
        </div>

        <div class="stat-box">
          <div class="stat-label">LOSSES</div>
          <div class="stat-value">${p.losses ?? "-"}</div>
        </div>
      </div>

    </div>
  `;
}

/* LOAD */
async function loadStats() {
  const el = document.getElementById("players");
  el.innerHTML = "Loading...";

  const results = await Promise.all(players.map(fetchPlayer));

  el.innerHTML = 
    render(results[0], "operator-glow-blue") +
    render(results[1], "operator-glow-orange") +
    results.slice(2).map(p => render(p, "")).join("");
}

loadStats();
</script>

</body>
</html>
