<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>R6 Operator Stats</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#05060a">

  <link rel="stylesheet" href="./style.css">
</head>

<body>

  <div class="energy-bg"></div>

  <header class="hud-header">
    <h1>R6 OPERATOR STATS</h1>
    <span class="hud-sub">LIVE COMBAT DATA</span>
  </header>
 <div class="nav-bar">
  <a href="/" class="back-home">
    <span class="arrow">⟵</span>
    <span class="text">HOMEPAGE</span>
  </a>
</div>

  <main class="hud-dashboard">
    <div id="players" class="operators-grid"></div>
  </main>

<script><div id="players"></div>

<script>
const API = "https://r6-api-backend.onrender.com/api/stats";

// 👉 Spieler laden (ROBUST)
async function fetchPlayer(name) {
  try {
    const res = await fetch(
      `${API}?nameOnPlatform=${encodeURIComponent(name)}&platformType=psn`
    );

    const text = await res.text();

    let data;
    try {
      data = JSON.parse(text);
    } catch {
      console.error("❌ API liefert HTML statt JSON:");
      console.log(text);
      return null;
    }

    if (!res.ok) {
      console.error("❌ API Fehler:", data);
      return null;
    }

    // 👉 Falls Backend schon fertig gemappt ist → direkt nutzen
    if (data.kills !== undefined) {
      return data;
    }

    // 👉 Falls RAW r6data (Fallback)
    const profile = data?.profiles?.[0];
    const stats = profile?.stats || {};

    const get = (key) => stats?.[key]?.value ?? null;

    const kills = get("kills");
    const deaths = get("deaths");

    return {
      username: name,
      platform: "PSN",

      kills,
      deaths,
      kd: (kills && deaths) ? (kills / deaths).toFixed(2) : null,

      wins: get("matchesWon"),
      losses: get("matchesLost"),
      level: get("level"),

      rank: get("rank") || "UNRANKED",
      mmr: get("mmr"),
      maxRank: get("maxRank"),
      maxMmr: get("maxMmr")
    };

  } catch (err) {
    console.error("Fetch Fehler:", err);
    return null;
  }
}

// 👉 sichere Anzeige
function safe(val, fallback = "-") {
  return val !== undefined && val !== null ? val : fallback;
}

// 👉 UI rendern
function renderOperator(p, glowClass) {
  if (!p) {
    return `
      <div class="operator-card ${glowClass}">
        <div class="operator-name">NO DATA</div>
        <div class="operator-tag">API ERROR</div>
      </div>
    `;
  }

  return `
    <div class="operator-card ${glowClass}">
      
      <div class="operator-header">
        <div>
          <div class="operator-name">${safe(p.username)}</div>
          <div class="operator-tag">${safe(p.platform)}</div>
        </div>
        <div class="operator-tag">
          ${safe(p.rank, "UNRANKED")} • ${safe(p.mmr, 0)} MMR
        </div>
      </div>

      <div class="section-title">COMBAT STATS</div>
      <div class="stats-grid">
        <div class="stat-box">
          <div class="stat-label">KILLS</div>
          <div class="stat-value">${safe(p.kills)}</div>
        </div>
        <div class="stat-box">
          <div class="stat-label">DEATHS</div>
          <div class="stat-value">${safe(p.deaths)}</div>
        </div>
        <div class="stat-box">
          <div class="stat-label">K/D</div>
          <div class="stat-value">${safe(p.kd, "0.00")}</div>
        </div>
      </div>

      <div class="section-title">MATCH STATS</div>
      <div class="stats-grid">
        <div class="stat-box">
          <div class="stat-label">WINS</div>
          <div class="stat-value">${safe(p.wins)}</div>
        </div>
        <div class="stat-box">
          <div class="stat-label">LOSSES</div>
          <div class="stat-value">${safe(p.losses)}</div>
        </div>
        <div class="stat-box">
          <div class="stat-label">LEVEL</div>
          <div class="stat-value">${safe(p.level)}</div>
        </div>
      </div>

      <div class="section-title">RANK HISTORY</div>
      <div class="stats-grid">
        <div class="stat-box">
          <div class="stat-label">CURRENT RANK</div>
          <div class="stat-value">${safe(p.rank)}</div>
        </div>
        <div class="stat-box">
          <div class="stat-label">MAX RANK</div>
          <div class="stat-value">${safe(p.maxRank)}</div>
        </div>
        <div class="stat-box">
          <div class="stat-label">MAX MMR</div>
          <div class="stat-value">${safe(p.maxMmr)}</div>
        </div>
      </div>

    </div>
  `;
}

// 👉 Hauptfunktion
async function loadStats() {
  const container = document.getElementById("players");

  container.innerHTML = "Loading...";

  const [p1, p2] = await Promise.all([
    fetchPlayer("BB_Pater_Odor"),
    fetchPlayer("SomaRay_Jr")
  ]);

  container.innerHTML = `
    ${renderOperator(p1, "operator-glow-blue")}
    ${renderOperator(p2, "operator-glow-orange")}
  `;

  setTimeout(loadStats, 60000);
}

// 👉 Start
loadStats();
</script>
  
  <div id="smoke-bg">
  <div class="fog-layer"></div>
  <div class="energy-layer"></div>
  <div class="noise-layer"></div>
  <div class="parallax-layer"></div>
</div>
  
</body>
</html>
