<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>R6 Operator Stats</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#05060a">

  <link rel="stylesheet" href="./style.css">

  <style>
    .mode-switch {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin: 20px;
    }

    .mode-switch button {
      padding: 10px 20px;
      border: none;
      background: #111;
      color: #aaa;
      cursor: pointer;
      border-radius: 6px;
    }

    .mode-switch .active {
      background: #00c3ff;
      color: black;
    }

    .kd {
      font-size: 24px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="energy-bg"></div>

  <header class="hud-header">
    <h1>R6 OPERATOR STATS</h1>
    <span class="hud-sub">LIVE COMBAT DATA</span>
  </header>

  <div class="nav-bar">
    <a href="/" class="back-home">
      <span class="arrow">⟵</span>
      <span class="text">HOMEPAGE</span>
    </a>
  </div>

  <!-- 🔥 SWITCH -->
  <div class="mode-switch">
    <button id="rankedBtn" class="active">RANKED</button>
    <button id="casualBtn">UNRANKED</button>
  </div>

  <main class="hud-dashboard">
    <div id="players" class="operators-grid"></div>
  </main>

  <script>
  const API = "https://r6-api-backend.onrender.com/api/stats";

  let currentMode = "ranked";

  document.getElementById("rankedBtn").onclick = () => {
    currentMode = "ranked";
    setActive("rankedBtn");
    loadStats();
  };

  document.getElementById("casualBtn").onclick = () => {
    currentMode = "casual";
    setActive("casualBtn");
    loadStats();
  };

  function setActive(id) {
    document.getElementById("rankedBtn").classList.remove("active");
    document.getElementById("casualBtn").classList.remove("active");
    document.getElementById(id).classList.add("active");
  }

  function getKDColor(kd) {
    if (!kd) return "#aaa";
    if (kd >= 1.3) return "#4caf50";
    if (kd >= 1.0) return "#ff9800";
    return "#f44336";
  }

async function fetchPlayer(name) {
  try {
    const res = await fetch(
      `${API}?nameOnPlatform=${encodeURIComponent(name)}&platformType=psn`
    );

    const data = await res.json();

    return currentMode === "ranked"
      ? data.ranked
      : data.casual;

  } catch (err) {
    console.error("Fetch Fehler:", err);
    return null;
  }
}

  function safe(v, f) {
    return v ?? f;
  }

  function renderOperator(p, glowClass) {
    if (!p) return `<div class="operator-card">NO DATA</div>`;

    return `
      <div class="operator-card ${glowClass}">
        
        <h2>${safe(p.username, "-")}</h2>
        <div>${safe(p.rank, "UNRANKED")} • ${safe(p.mmr, 0)} MMR</div>

        <div class="kd" style="color:${getKDColor(p.kd)}">
          ${safe(p.kd, "0.00")} KD
        </div>

        <div>Kills: ${safe(p.kills, "-")}</div>
        <div>Deaths: ${safe(p.deaths, "-")}</div>

        <div>Wins: ${safe(p.wins, "-")}</div>
        <div>Losses: ${safe(p.losses, "-")}</div>

        <div>Level: ${safe(p.level, "-")}</div>

      </div>
    `;
  }

  async function loadStats() {
    const container = document.getElementById("players");
    container.innerHTML = "Loading...";

    const [p1, p2] = await Promise.all([
      fetchPlayer("BB_Pater_Odor"),
      fetchPlayer("SomaRay_Jr")
    ]);

    container.innerHTML =
      renderOperator(p1, "operator-glow-blue") +
      renderOperator(p2, "operator-glow-orange");
  }

  loadStats();
  </script>

  <div id="smoke-bg">
    <div class="fog-layer"></div>
    <div class="energy-layer"></div>
    <div class="noise-layer"></div>
    <div class="parallax-layer"></div>
  </div>

</body>
</html>
