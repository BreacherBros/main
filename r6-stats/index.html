</html><!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>R6 Operator Stats</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#05060a">

  <link rel="stylesheet" href="./style.css">
</head>

<body>

  <div class="energy-bg"></div>

  <header class="hud-header">
    <h1>R6 OPERATOR STATS</h1>
    <span class="hud-sub">LIVE COMBAT DATA</span>
  </header>

  <div class="nav-bar">
    <a href="/" class="back-home">
      <span class="arrow">⟵</span>
      <span class="text">HOMEPAGE</span>
    </a>
  </div>

<div class="mode-switch">
  <button id="rankedBtn" class="active">RANKED</button>
  <button id="casualBtn">UNRANKED</button>
</div>
  
  <main class="hud-dashboard">
    <div id="players" class="operators-grid"></div>
  </main>

  <script>
  const API = "https://r6-api-backend.onrender.com/api/stats";

  async function fetchPlayer(name) {
    try {
      const res = await fetch(
        API + "?nameOnPlatform=" + encodeURIComponent(name) + "&platformType=psn"
      );

      const text = await res.text();

      let data;
      try {
        data = JSON.parse(text);
      } catch (e) {
        console.error("❌ Kein JSON:", text);
        return null;
      }

      if (!res.ok) return null;

      if (data.kills !== undefined) return data;

      const profile = data?.profiles?.[0];
      const stats = profile?.stats || {};

      function get(key) {
        return stats[key]?.value ?? null;
      }

      const kills = get("kills");
      const deaths = get("deaths");

      return {
        username: name,
        platform: "PSN",
        kills: kills,
        deaths: deaths,
        kd: (kills && deaths) ? (kills / deaths).toFixed(2) : null,
        wins: get("matchesWon"),
        losses: get("matchesLost"),
        level: get("level"),
        rank: get("rank") || "UNRANKED",
        mmr: get("mmr"),
        maxRank: get("maxRank"),
        maxMmr: get("maxMmr")
      };

    } catch (err) {
      console.error("Fetch Fehler:", err);
      return null;
    }
  }

  function safe(val, fallback) {
    return val !== undefined && val !== null ? val : fallback;
  }

  function renderOperator(p, glowClass) {
    if (!p) {
      return '<div class="operator-card ' + glowClass + '">NO DATA</div>';
    }

    return `
      <div class="operator-card ${glowClass}">
        <div class="operator-header">
          <div>
            <div class="operator-name">${safe(p.username, "-")}</div>
            <div class="operator-tag">${safe(p.platform, "-")}</div>
          </div>
          <div class="operator-tag">
            ${safe(p.rank, "UNRANKED")} • ${safe(p.mmr, 0)} MMR
          </div>
        </div>

        <div class="section-title">COMBAT</div>
        <div>Kills: ${safe(p.kills, "-")}</div>
        <div>Deaths: ${safe(p.deaths, "-")}</div>
        <div>KD: ${safe(p.kd, "0.00")}</div>

        <div class="section-title">MATCHES</div>
        <div>Wins: ${safe(p.wins, "-")}</div>
        <div>Losses: ${safe(p.losses, "-")}</div>
        <div>Level: ${safe(p.level, "-")}</div>
      </div>
    `;
  }

  async function loadStats() {
    const container = document.getElementById("players");
    container.innerHTML = "Loading...";

    const p1 = await fetchPlayer("BB_Pater_Odor");
    const p2 = await fetchPlayer("SomaRay_Jr");

    container.innerHTML =
      renderOperator(p1, "operator-glow-blue") +
      renderOperator(p2, "operator-glow-orange");

    setTimeout(loadStats, 60000);
  }

  loadStats();
  </script>

  <div id="smoke-bg">
    <div class="fog-layer"></div>
    <div class="energy-layer"></div>
    <div class="noise-layer"></div>
    <div class="parallax-layer"></div>
  </div>

</body>
</html>
