<script>
document.addEventListener("DOMContentLoaded", () => {

const API = "https://r6-api-backend.onrender.com/api/stats";

// ✅ DOM FIX (kein weißer Screen mehr)
const rankedBtn = document.getElementById("rankedBtn");
const casualBtn = document.getElementById("casualBtn");
const playerInput = document.getElementById("playerInput");
const platformSelect = document.getElementById("platformSelect");

let currentMode = "ranked";
let isLoading = false;

let players = [
  {
    names: { psn: "BB_Pater_Odor", uplay: "BB_Pater_Odor" },
    platform: "psn",
    user: false
  },
  {
    names: { psn: "SomaRay_Jr", uplay: "BB_SomaRay" },
    platform: "psn",
    user: false
  }
];

/* MODE SWITCH */
rankedBtn.onclick = () => {
  currentMode = "ranked";
  setActive("rankedBtn");
  loadStats();
};

casualBtn.onclick = () => {
  currentMode = "casual";
  setActive("casualBtn");
  loadStats();
};

function setActive(id) {
  rankedBtn.classList.remove("active");
  casualBtn.classList.remove("active");
  document.getElementById(id).classList.add("active");
}

/* ADD PLAYER */
window.searchPlayer = function () {
  const name = playerInput.value.trim();
  const platform = platformSelect.value;

  if (!name) return;

  players.push({
    names: { psn: name, uplay: name },
    platform,
    user: true
  });

  playerInput.value = "";
  loadStats();
};

/* RANK SYSTEM */
function getRankFromMMR(mmr) {
  if (!mmr) return { name: "UNRANKED", color: "#777" };

  const tiers = [
    { name: "COPPER", color: "#a52019" },
    { name: "BRONZE", color: "#a97142" },
    { name: "SILVER", color: "#c0c0c0" },
    { name: "GOLD", color: "#ffd700" },
    { name: "PLATINUM", color: "#4fc3f7" },
    { name: "EMERALD", color: "#00ff88" },
    { name: "DIAMOND", color: "#00e5ff" }
  ];

  let i = Math.floor(mmr / 500) - 2;
  i = Math.max(0, Math.min(i, tiers.length - 1));

  const div = 5 - Math.floor((mmr % 500) / 100);

  return {
    name: `${tiers[i].name} ${div}`,
    color: tiers[i].color
  };
}

/* HELPERS */
function getKDColor(kd) {
  if (!kd) return "#aaa";
  kd = parseFloat(kd);

  if (kd >= 1.5) return "#00ff88";
  if (kd >= 1.2) return "#4caf50";
  if (kd >= 1.0) return "#ff9800";
  return "#f44336";
}

function getWinrate(w, l) {
  if (w == null || l == null) return "-";
  return ((w / (w + l)) * 100).toFixed(1);
}

/* 🔥 PEAK BERECHNEN */
function getPeakFromHistory(history) {
  if (!history || !history.data) return null;

  let peak = history.data[0][1];

  for (const entry of history.data) {
    if (entry[1].value > peak.value) {
      peak = entry[1];
    }
  }

  return {
    mmr: peak.value,
    rank: peak.metadata.rank,
    color: peak.metadata.color
  };
}

/* FETCH */
async function fetchPlayer(p) {
  try {
    const name = p.names[p.platform];

    // 🔹 MAIN API
    const res = await fetch(
      `${API}?nameOnPlatform=${encodeURIComponent(name)}&platformType=${p.platform}`
    );
    const data = await res.json();

    if (!data || data.error) return null;

    // 🔹 HISTORY (OPTIONAL)
    let peak = null;

    try {
      const historyRes = await fetch(
        `https://r6data.eu/api/player/${encodeURIComponent(name)}/history`
      );
      const historyJson = await historyRes.json();
      peak = getPeakFromHistory(historyJson.data?.history);
    } catch (e) {
      console.warn("No history available");
    }

    const modeData = currentMode === "ranked" ? data.ranked : data.casual;

    return {
      ...modeData,

      // 🔥 PEAK (fallback = aktueller Rank)
      bestMMR: peak?.mmr || modeData.mmr,
      bestRank: peak?.rank || getRankFromMMR(modeData.mmr).name,
      bestRankColor: peak?.color || getRankFromMMR(modeData.mmr).color,

      platform: p.platform,
      user: p.user
    };

  } catch (err) {
    console.error("Fetch Fehler:", err);
    return null;
  }
}

/* RENDER */
function render(p) {
  if (!p) return `<div class="operator-card">NO DATA</div>`;

  const rank = getRankFromMMR(p.mmr);

  return `
  <div class="operator-card" style="--rank-color:${rank.color}">

    <div class="operator-name">${p.username}</div>

    <div class="rank" style="color:${rank.color}">
      ${rank.name} • ${p.mmr}
    </div>

    <div class="peak-rank" style="color:${p.bestRankColor}">
      🏆 ${p.bestRank} • ${p.bestMMR}
    </div>

    <div class="kd-value" style="color:${getKDColor(p.kd)}">
      ${p.kd} KD
    </div>

  </div>
  `;
}

/* LOAD */
async function loadStats() {
  if (isLoading) return;
  isLoading = true;

  const el = document.getElementById("players");
  el.innerHTML = "Loading...";

  const results = [];

  for (const p of players) {
    results.push(await fetchPlayer(p));
  }

  el.innerHTML = results.map(render).join("");

  isLoading = false;
}

loadStats();

});
</script>
